<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; }
        #markmap-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="markmap-container"></div>

    <script>
        // Функция ожидания реальных размеров в пикселях
        function waitForPixelDimensions(element, maxWait = 2000) {
            return new Promise((resolve) => {
                const start = Date.now();
                let lastRect = null;
                let stableCount = 0;

                function check() {
                    const rect = element.getBoundingClientRect();
                    const hasSize = rect.width > 0 && rect.height > 0;
                    const isStable = lastRect && rect.width === lastRect.width && rect.height === lastRect.height;
                    lastRect = rect;

                    if (hasSize && isStable) {
                        resolve({ width: rect.width, height: rect.height });
                    } else if (Date.now() - start > maxWait) {
                        console.warn('Таймаут, использую fallback 800x600');
                        resolve({ width: 800, height: 600 });
                    } else {
                        requestAnimationFrame(check);
                    }
                }
                check();
            });
        }

        // Функция загрузки скриптов
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        async function init() {
            try {
                // Загружаем зависимости
                await loadScript('d3.js');
                await loadScript('markmap-lib.umd.js');
                await loadScript('markmap-view.umd.js');

                const container = document.getElementById('markmap-container');
                const transformer = new window.markmapLib.Transformer();
                let currentMap = null;

                // Основная функция рендеринга
                window.renderMap = async function(markdown) {
                    if (!container) return;

                    // Ждём стабильных пиксельных размеров
                    const { width, height } = await waitForPixelDimensions(container);

                    const { root } = transformer.transform(markdown || '# Пустой документ\n## Нет данных');

                    // Создаём SVG с явными размерами
                    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.setAttribute('width', width);
                    svg.setAttribute('height', height);
                    svg.style.width = '100%';
                    svg.style.height = '100%';
                    svg.style.display = 'block';

                    container.innerHTML = '';
                    container.appendChild(svg);

                    if (currentMap) {
                        currentMap.setData(root);
                    } else {
                        currentMap = window.markmapView.Markmap.create(svg, null, root);
                    }
                };

                window.updateMarkmap = window.renderMap;

                // Обработка сообщений от родителя
                window.addEventListener('message', async (event) => {
                    if (event.data.type === 'updateMap') {
                        await window.renderMap(event.data.markdown);
                    }
                });

                // Сигнал родителю о готовности
                window.parent.postMessage({ type: 'mapReady' }, '*');

                // Стартовая карта
                await window.renderMap('# Загрузка...\n## Карта готова');

            } catch (error) {
                console.error('Ошибка инициализации:', error);
                document.body.innerHTML = `<div style="color:red;padding:20px;">Ошибка: ${error.message}</div>`;
            }
        }

        init();
    </script>
</body>
</html>
