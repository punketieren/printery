<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Markmap</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/d3@6.7.0/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.3/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.3/dist/index.min.js"></script>
</head>
<body>
    <svg id="map"></svg>
    <script>
        const markdown = `
# Простая карта
## Тема 1
- Пункт А
- Пункт Б
## Тема 2
- Пункт В
- Пункт Г
### Подтема
Деталь
`;

        const { Transformer } = markmap;
        const transformer = new Transformer();
        const { root } = transformer.transform(markdown);
        markmap.Markmap.create(document.getElementById('map'), null, root);
    </script>
</body>
</html>
