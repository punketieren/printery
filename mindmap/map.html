<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; }
        #markmap-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="markmap-container"></div>

    <script>
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        (async function() {
            try {
                await loadScript('d3.js');
                await loadScript('markmap-lib.js');
                await loadScript('markmap-view.js');

                const container = document.getElementById('markmap-container');
                const transformer = new window.markmap.Transformer();
                
                // Глобальные переменные
                window.currentMap = null;
                window.currentSvg = null;
                window.expandLevel = 6;  // можно менять из консоли

                async function render(markdownText) {
                    if (!container) return;

                    // Передаём текущий уровень раскрытия
                    const { root } = transformer.transform(markdownText || '# Пустой документ\n## Нет данных', {
                        initialExpandLevel: window.expandLevel
                    });

                    if (window.currentMap && window.currentSvg && window.currentSvg.parentNode === container) {
                        window.currentMap.setData(root);
                    } else {
                        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                        svg.style.width = '100%';
                        svg.style.height = '100%';
                        svg.style.display = 'block';

                        container.innerHTML = '';
                        container.appendChild(svg);
                        window.currentSvg = svg;
                        window.currentMap = window.markmap.Markmap.create(svg, null, root);
                    }
                }

                window.updateMarkmap = render;
                window.parent.postMessage({ type: 'mapReady' }, '*');

                await render('# Загрузка...\n## Карта готова');
            } catch (err) {
                console.error(err);
                document.body.innerHTML = `<div style="color:red;padding:20px;">Ошибка: ${err.message}</div>`;
            }
        })();
    </script>
</body>
</html>
