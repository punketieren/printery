<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        /* Базовые стили для карты */
        .markmap {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .markmap > svg {
            width: 100%;
            height: 100%;
        }
        body { margin: 0; overflow: hidden; }
        #markmap-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="markmap-container"></div>

    <!-- 1. Сначала добавляем конфиг (если нужен) -->
    <script>
        // Настройка автозагрузчика (по желанию)
        window.markmap = {
            autoLoader: {
                manual: true,   // Ручной режим: мы сами скажем, когда рендерить
                toolbar: false, // Отключаем тулбар, чтобы был только чистый граф
            }
        };
    </script>

    <!-- 2. Подключаем волшебный autoloader -->
    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@latest"></script>

    <!-- 3. Управляем картой вручную -->
    <script>
        let currentMapContainer = null;

        // Функция для обновления карты
        function renderMap(markdownText) {
            const container = document.getElementById('markmap-container');
            if (!container) return;

            // Очищаем контейнер
            container.innerHTML = '';

            // Создаём новый элемент с классом markmap
            const markmapDiv = document.createElement('div');
            markmapDiv.className = 'markmap';
            container.appendChild(markmapDiv);

            // Вставляем Markdown внутрь как script type="text/template"
            const scriptTemplate = document.createElement('script');
            scriptTemplate.type = 'text/template';
            scriptTemplate.textContent = markdownText || '# Пустой документ\n## Нет данных';
            markmapDiv.appendChild(scriptTemplate);

            // Запускаем рендеринг для нового элемента
            if (window.markmap && window.markmap.autoLoader) {
                window.markmap.autoLoader.renderAll();
            }
        }

        // Глобальная функция для обновления из редактора
        window.updateMarkmap = function(markdown) {
            renderMap(markdown);
        };

        // Слушаем сообщения от родительского окна (index.html)
        window.addEventListener('message', (event) => {
            if (event.data.type === 'updateMap') {
                renderMap(event.data.markdown);
            }
        });

        // Сигнал родителю, что карта готова
        window.parent.postMessage({ type: 'mapReady' }, '*');

        // Инициализация карты с тестовым текстом
        renderMap('# Загрузка...\n## Карта готова к работе');
    </script>
</body>
</html>
