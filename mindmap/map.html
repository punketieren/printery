<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Markmap</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <svg id="map"></svg>
    
    <script type="importmap">
        {
            "imports": {
                "markmap-lib": "https://cdn.jsdelivr.net/npm/markmap-lib@0.15.3/dist/index.js",
                "markmap-view": "https://cdn.jsdelivr.net/npm/markmap-view@0.15.3/dist/index.js",
                "d3": "https://cdn.jsdelivr.net/npm/d3@6.7.0/dist/d3.min.js"
            }
        }
    </script>
    
    <script type="module">
        import { Transformer } from 'markmap-lib';
        import { Markmap } from 'markmap-view';
        
        const markdown = `
# Простая карта
## Тема 1
- Пункт А
- Пункт Б
## Тема 2
- Пункт В
- Пункт Г
### Подтема
Деталь
`;
        
        const transformer = new Transformer();
        const { root } = transformer.transform(markdown);
        Markmap.create('#map', null, root);
    </script>
</body>
</html>
