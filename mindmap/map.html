<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background: #fff; }
        .markmap { position: relative; width: 100%; height: 100%; }
        .markmap > svg { width: 100%; height: 100%; display: block; }
        #markmap-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="markmap-container"></div>

    <script>
        window.markmap = { autoLoader: { manual: true, toolbar: false } };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@latest"></script>

    <script>
        function renderMap(markdown) {
            const container = document.getElementById('markmap-container');
            if (!container) return;

            container.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'markmap';
            const script = document.createElement('script');
            script.type = 'text/template';
            script.textContent = markdown || '# Пустой документ\n## Нет данных';
            div.appendChild(script);
            container.appendChild(div);

            // Ждём реальных размеров контейнера, а не просто таймаута
            function waitForSize(callback) {
                const rect = container.getBoundingClientRect();
                if (rect.width > 0 && rect.height > 0) {
                    callback();
                } else {
                    requestAnimationFrame(() => waitForSize(callback));
                }
            }

            waitForSize(() => {
                if (window.markmap?.autoLoader) {
                    window.markmap.autoLoader.renderAll();
                }
            });
        }

        window.updateMarkmap = renderMap;
        window.addEventListener('message', (e) => {
            if (e.data.type === 'updateMap') renderMap(e.data.markdown);
        });
        window.parent.postMessage({ type: 'mapReady' }, '*');
        renderMap('# Загрузка...\n## Карта готова');
    </script>
</body>
</html>
