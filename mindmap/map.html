<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; }
        #markmap-container { width: 100vw; height: 100vh; }
    </style>
    <!-- Подключаем библиотеки из твоей локальной папки libs -->
    <script src="libs/d3.js"></script>
    <script src="libs/markmap-lib.js"></script>
    <script src="libs/markmap-view.js"></script>
</head>
<body>
    <div id="markmap-container"></div>
    <script>
        let currentMap = null;

        function renderMap(markdown) {
            const container = document.getElementById('markmap-container');
            if (!container) return;
            const transformer = new window.markmapLib.Transformer();
            const { root } = transformer.transform(markdown || '# Пусто\n## Нет данных');
            if (currentMap) {
                currentMap.setData(root);
            } else {
                currentMap = window.markmapView.Markmap.create(container, null, root);
            }
        }

        // Глобальная функция для вызова из консоли или из родительского окна
        window.updateMarkmap = renderMap;

        // Принимаем сообщения от родительского окна (index.html)
        window.addEventListener('message', (event) => {
            if (event.data.type === 'updateMap') {
                renderMap(event.data.markdown);
            }
        });

        // Сообщаем родителю, что карта загрузилась и готова к работе
        window.parent.postMessage({ type: 'mapReady' }, '*');

        // Показываем что-нибудь до получения настоящих данных
        renderMap('# Загрузка...\n## Карта готова к работе');
    </script>
</body>
</html>
