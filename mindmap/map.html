<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background: #fff; }
        .markmap { position: relative; width: 100%; height: 100%; }
        .markmap > svg { width: 100%; height: 100%; display: block; }
        #markmap-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="markmap-container"></div>

    <script>
        window.markmap = { autoLoader: { manual: true, toolbar: false } };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@latest"></script>

    <script>
        function renderMap(markdown) {
    const container = document.getElementById('markmap-container');
    if (!container) return;

    // Находим существующий элемент .markmap или создаём новый
    let markmapDiv = container.querySelector('.markmap');
    if (!markmapDiv) {
        markmapDiv = document.createElement('div');
        markmapDiv.className = 'markmap';
        container.appendChild(markmapDiv);
    }

    // Обновляем содержимое скрипта
    let script = markmapDiv.querySelector('script[type="text/template"]');
    if (!script) {
        script = document.createElement('script');
        script.type = 'text/template';
        markmapDiv.appendChild(script);
    }
    script.textContent = markdown || '# Пустой документ\n## Нет данных';

    // Функция безопасного рендеринга
    const tryRender = () => {
        if (!window.markmap?.autoLoader) return;
        const rect = container.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
            window.markmap.autoLoader.renderAll();
        } else {
            requestAnimationFrame(tryRender);
        }
    };

    tryRender();
}

        window.updateMarkmap = renderMap;
        window.addEventListener('message', (e) => {
            if (e.data.type === 'updateMap') renderMap(e.data.markdown);
        });
        window.parent.postMessage({ type: 'mapReady' }, '*');
        renderMap('# Загрузка...\n## Карта готова');
    </script>
</body>
</html>
