<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; }
        #markmap-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="markmap-container"></div>

    <script>
        // Функция загрузки скриптов
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        // Функция ожидания реальных размеров контейнера (в пикселях)
        function waitForSize(element, maxWait = 2000) {
            return new Promise((resolve) => {
                const start = Date.now();
                let lastRect = null;
                function check() {
                    const rect = element.getBoundingClientRect();
                    const hasSize = rect.width > 0 && rect.height > 0;
                    const isStable = lastRect && rect.width === lastRect.width && rect.height === lastRect.height;
                    lastRect = rect;
                    if (hasSize && isStable) {
                        resolve({ width: rect.width, height: rect.height });
                    } else if (Date.now() - start > maxWait) {
                        resolve({ width: 800, height: 600 });
                    } else {
                        requestAnimationFrame(check);
                    }
                }
                check();
            });
        }

        (async function() {
            try {
                // 1. Загружаем зависимости
                await loadScript('d3.js');
                await loadScript('markmap-lib.js');
                await loadScript('markmap-view.js');

                // 2. Готовим контейнер
                const container = document.getElementById('markmap-container');
                const transformer = new window.markmap.Transformer();
                let currentMap = null;

                // 3. Функция рендеринга (общая для инициализации и обновления)
                async function render(markdownText) {
                    if (!container) return;

                    // Ждём реальных размеров контейнера
                    const { width, height } = await waitForSize(container);

                    // Готовим данные
                    const { root } = transformer.transform(markdownText || '# Пустой документ\n## Нет данных');

                    // Создаём SVG с явными размерами (пиксели)
                    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.setAttribute('width', width);
                    svg.setAttribute('height', height);
                    svg.style.width = '100%';
                    svg.style.height = '100%';
                    svg.style.display = 'block';

                    // Очищаем контейнер и вставляем новый SVG
                    container.innerHTML = '';
                    container.appendChild(svg);

                    // Создаём или обновляем карту
                    if (currentMap) {
                        currentMap.setData(root);
                    } else {
                        currentMap = window.markmap.Markmap.create(svg, null, root);
                    }
                }

                // 4. Глобальная функция для обновления карты извне
                window.updateMarkmap = render;

                // 5. Сигнал родительскому окну, что карта готова
                window.parent.postMessage({ type: 'mapReady' }, '*');

                // 6. Начальная отрисовка
                await render('# Загрузка...\n## Карта готова');
            } catch (err) {
                console.error('Ошибка инициализации:', err);
                document.body.innerHTML = `<div style="color:red;padding:20px;">Ошибка: ${err.message}</div>`;
            }
        })();
    </script>
</body>
</html>
