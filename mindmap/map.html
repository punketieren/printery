<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Markmap — простая карта</title>
    <style>
        .markmap {
            position: relative;
        }
        .markmap > svg {
            width: 100%;
            height: 100vh;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="markmap">
        <script type="text/template">
            # Простая карта
            ## Тема 1
            - Пункт А
            - Пункт Б
            ## Тема 2
            - Пункт В
            - Пункт Г
            ### Подтема
            Деталь
        </script>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@latest"></script>
</body>
</html>
