<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; }
        #markmap-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="markmap-container"></div>

    <script>
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        (async function() {
            try {
                await loadScript('d3.js');
                await loadScript('markmap-lib.js');
                await loadScript('markmap-view.js');

                const container = document.getElementById('markmap-container');
                const transformer = new window.markmap.Transformer();
                
                // Глобальные переменные для управления извне
                window.currentMap = null;
                window.currentSvg = null;
                window.currentMarkdown = '';

                async function render(markdownText) {
                    if (!container) return;
                    window.currentMarkdown = markdownText;

                    // Парсим Markdown в дерево
                    const { root } = transformer.transform(markdownText || '# Пустой документ\n## Нет данных');

                    if (window.currentMap && window.currentSvg && window.currentSvg.parentNode === container) {
                        // Обновляем существующую карту
                        window.currentMap.setData(root);
                    } else {
                        // Создаём новую карту
                        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                        svg.style.width = '100%';
                        svg.style.height = '100%';
                        svg.style.display = 'block';

                        container.innerHTML = '';
                        container.appendChild(svg);
                        window.currentSvg = svg;
                        window.currentMap = window.markmap.Markmap.create(svg, null, root);
                    }
                }

                window.updateMarkmap = render;

                // Функция для сворачивания узлов глубже определённого уровня
                window.collapseLevel = (level) => {
                    if (!window.currentMap || !window.currentMap.state || !window.currentMap.state.root) return;

                    function setFold(node, currentDepth = 1) {
                        if (!node) return;
                        if (node.children && node.children.length) {
                            node.payload = node.payload || {};
                            // fold: 1 — свёрнут, 0 — развёрнут
                            node.payload.fold = (currentDepth >= level) ? 1 : 0;
                            node.children.forEach(child => setFold(child, currentDepth + 1));
                        }
                    }

                    setFold(window.currentMap.state.root);
                    window.currentMap.setData(window.currentMap.state.root);
                };

                // Функция для разворачивания всех узлов
                window.expandAll = () => {
                    if (!window.currentMap || !window.currentMap.state || !window.currentMap.state.root) return;

                    function unfold(node) {
                        if (!node) return;
                        if (node.children && node.children.length) {
                            node.payload = node.payload || {};
                            node.payload.fold = 0;
                            node.children.forEach(unfold);
                        }
                    }

                    unfold(window.currentMap.state.root);
                    window.currentMap.setData(window.currentMap.state.root);
                };

                // Сигнал родительскому окну, что карта готова
                window.parent.postMessage({ type: 'mapReady' }, '*');

                // Стартовая отрисовка
                await render('# Загрузка...\n## Карта готова');
            } catch (err) {
                console.error(err);
                document.body.innerHTML = `<div style="color:red;padding:20px;">Ошибка: ${err.message}</div>`;
            }
        })();
    </script>
</body>
</html>
