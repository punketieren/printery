        // --- ДОБАВЛЕНИЕ КНОПКИ РЯДОМ СО СТАНДАРТНЫМИ КНОПКАМИ ЗУМА ---
        function waitForZoomButtons() {
            const buttons = document.querySelectorAll('.openseadragon-container > div');
            let zoomContainer = null;
            for (let btn of buttons) {
                const img = btn.querySelector('img');
                if (img && (img.src.includes('zoom_in') || img.src.includes('zoom_out'))) {
                    zoomContainer = btn.parentElement;
                    break;
                }
            }
            if (zoomContainer) {
                if (zoomContainer.querySelector('.custom-home-button')) return;
                const myButton = document.createElement('div');
                myButton.className = 'custom-home-button';
                myButton.title = 'Сброс вида';
                myButton.style.cssText = `
                    display: inline-block;
                    width: 28px;
                    height: 28px;
                    background: rgba(0,0,0,0.7);
                    border: 1px solid #ccc;
                    border-radius: 4px;
                    color: white;
                    cursor: pointer;
                    margin: 2px;
                    font-size: 18px;
                    text-align: center;
                    line-height: 28px;
                `;
                myButton.innerHTML = '⚡';
                myButton.onclick = () => viewer.viewport.goHome();
                zoomContainer.appendChild(myButton);
                console.log('✅ Кнопка добавлена');
            } else {
                console.log('⏳ Контейнер с кнопками зума не найден, жду...');
                setTimeout(waitForZoomButtons, 200);
            }
        }
        setTimeout(waitForZoomButtons, 500);
    });

    viewer.canvas.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        const currentZoom = viewer.viewport.getZoom();
        const minZoom = viewer.viewport.getHomeZoom();
        if (currentZoom <= minZoom) return false;
        const viewportPoint = viewer.viewport.pointFromPixel(new OpenSeadragon.Point(e.clientX, e.clientY));
        viewer.viewport.zoomBy(1 / zoomStep, viewportPoint);
        return false;
    });

    viewer.canvas.addEventListener('dblclick', function(e) {
        e.preventDefault();
        const viewportPoint = viewer.viewport.pointFromPixel(new OpenSeadragon.Point(e.clientX, e.clientY));
        viewer.viewport.zoomBy(zoomStep, viewportPoint);
    });
