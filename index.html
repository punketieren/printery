<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Deep Zoom Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/openseadragon.min.css">
    <style>
        body { margin: 0; padding: 0; }
        #viewer { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="viewer"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/openseadragon.min.js"></script>
  
    <script>
const viewer = OpenSeadragon({
    id: "viewer",
    prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/images/",
    tileSources: "output.dzi",
    maxZoomLevel: 11,
    showZoomControl: false  // Отключаем стандартные кнопки
});

// Создаем свои кнопки
const controls = document.createElement('div');
controls.style.position = 'fixed';
controls.style.bottom = '20px';
controls.style.right = '20px';
controls.style.zIndex = '1000';
controls.innerHTML = `
    <button id="custom-zoom-in" style="width:40px;height:40px;margin:5px;font-size:20px;">+</button>
    <button id="custom-zoom-out" style="width:40px;height:40px;margin:5px;font-size:20px;">-</button>
`;
document.body.appendChild(controls);

// Настраиваем свои кнопки
document.getElementById('custom-zoom-in').onclick = () => {
    const currentZoom = viewer.viewport.getZoom();
    const nextLevel = currentZoom * 2;
    if (nextLevel <= viewer.source.maxLevel) {
        viewer.viewport.zoomTo(nextLevel);
    }
};

document.getElementById('custom-zoom-out').onclick = () => {
    const currentZoom = viewer.viewport.getZoom();
    const prevLevel = currentZoom / 2;
    if (prevLevel >= viewer.source.minLevel) {
        viewer.viewport.zoomTo(prevLevel);
    }
};

    </script>    
</body>
</html>
