<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>...testing OpenSeeDragon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/openseadragon.min.css">
    <style>
* { margin: 0;
    padding: 0;
    box-sizing: border-box;}
.container {    display: flex;
				width: 100%;
				height: 100vh;}
.sidebar {      width: 20%;  /* 20% от ширины родителя */
				min-width: 200px;  /* минимальная ширина, чтобы не сжималась слишком сильно */
				max-width: 400px;  /* максимальная ширина */
				background: #2d2d2d;
				border-right: 1px solid #444;
				padding: 20px;
				overflow-y: auto;
				color: white;}
.viewer-container {    flex: 1;
				position: relative;
				background: #000;}
#viewer {	    width: 100%;
				height: 100%;}
.viewer-container {    position: relative;}
.viewer-container::after {    content: "";
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				pointer-events: none;
				background-image: url('noise.png');
				background-repeat: repeat;
				background-size: 256px 256px;
				opacity: 0.15;
				z-index: 10;}
.viewer-container {
    background-image: url('noise_inversion.png');
    background-repeat: repeat;
    background-size: 256px 256px;
    background-color: #000;
}

#viewer {
    background: transparent;  /* чтобы фон просвечивал */
}
				</style>
	<link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <div class="container">
        <div class="sidebar"> <!-- здесь позже добавите информацию --> </div>
        <div class="viewer-container">
			<div id="viewer"></div>
        </div>
    </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/openseadragon.min.js"> </script><script src="https://openseadragon.github.io/svg-overlay/openseadragon-svg-overlay.js"></script>
    <script>
        const viewer = OpenSeadragon({
            id: "viewer",
            prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/images/",
            tileSources: "output.dzi",
            gestureSettingsMouse: {	clickToZoom: false,
									dblClickToZoom: false    },
            smoothTileEdges: false,
            imageSmoothingEnabled: false,
            preloadCount: 20,
            imageLoaderLimit: 10,
            maxImageCacheCount: 500,
            timeout: 15000        });
        let zoomStep = 2;
viewer.addHandler('open', function() {
    console.log("1. Обработчик начал работу");
    const homeZoom = viewer.viewport.getHomeZoom();    // Настройка зума
    const fullZoom = viewer.viewport.imageToViewportZoom(1);
    const zoomStep = Math.pow(fullZoom / homeZoom, 1 / 7);
    viewer.zoomPerClick = zoomStep;
    viewer.zoomPerScroll = zoomStep;
    window.zoomStep = zoomStep;
    console.log("2. Зум настроен");
    console.log("4. Начинаю создавать сетку");    // Создание сетки
    svgOverlay = viewer.svgOverlay();
    console.log("5. svgOverlay создан:", svgOverlay);
    const imageAspect = viewer.source.dimensions.y / viewer.source.dimensions.x;
    console.log("6. imageAspect =", imageAspect);
    const cols = 21;
    const rows = 20;
    console.log("7. Сетка", cols, "x", rows);
    let rectCount = 0;
    for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", col / cols);
        rect.setAttribute("y", (row / rows) * imageAspect);
        rect.setAttribute("width", 1 / cols);
        rect.setAttribute("height", (1 / rows) * imageAspect);
        rect.setAttribute("fill", "rgba(0, 0, 0, 0.05)");
        rect.setAttribute("stroke", "black");
        rect.setAttribute("stroke-width", "0.0005");
        rect.setAttribute("stroke-opacity", "1");
        rect.setAttribute("cursor", "pointer");
        rect.setAttribute("data-title", `Ячейка ${row+1}-${col+1}`);
        svgOverlay.node().appendChild(rect);
        rectCount++;
        
        new OpenSeadragon.MouseTracker({	element: rect,
											clickHandler: function(event) {
                if (event.quick) {	const title = rect.getAttribute("data-title");
updateSidebar(title, "Информация о ячейке", "https://example.com");     }
                return false;
            }
        }).setTracking(true);
    }
}
});
function updateSidebar(title, info, link) {               //обработка клика
    const sidebar = document.querySelector('.sidebar');
    sidebar.innerHTML = `
        <div style="background: #3a3a3a; border-radius: 8px; padding: 20px;">
            <h3 style="margin-bottom: 15px; color: #ffaa00;">${title}</h3>
            <p style="margin: 10px 0;">${info}</p>
            <a href="${link}" target="_blank" style="color: #66ccff;">${link}</a>
        </div>
    `;
}
        viewer.canvas.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            const currentZoom = viewer.viewport.getZoom();
            const minZoom = viewer.viewport.getHomeZoom();
            if (currentZoom <= minZoom) return false;
            const viewportPoint = viewer.viewport.pointFromPixel(new OpenSeadragon.Point(e.clientX, e.clientY));
            viewer.viewport.zoomBy(1 / zoomStep, viewportPoint);
            return false;
        });
        viewer.canvas.addEventListener('dblclick', function(e) {
            e.preventDefault();
            const viewportPoint = viewer.viewport.pointFromPixel(new OpenSeadragon.Point(e.clientX, e.clientY));
            viewer.viewport.zoomBy(zoomStep, viewportPoint);
        });
        let svgOverlay = null;
    </script>
</body>
</html>
