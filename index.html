<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>...testing OpenSeeDragon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/openseadragon.min.css">
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
.container {
    display: flex;
    width: 100%;
    height: 100vh;
}
.sidebar {
        width: 20%;  /* 20% от ширины родителя */
    min-width: 200px;  /* минимальная ширина, чтобы не сжималась слишком сильно */
    max-width: 400px;  /* максимальная ширина */
    background: #2d2d2d;
    border-right: 1px solid #444;
    padding: 20px;
    overflow-y: auto;
    color: white;
}
.viewer-container {
    flex: 1;
    position: relative;
    background: #000;
}
#viewer {
    width: 100%;
    height: 100%;
}
    </style>
	<link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <!-- здесь позже добавите информацию -->
        </div>
        <div class="viewer-container">
    <div id="viewer"></div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/openseadragon.min.js"></script>
    <script src="https://openseadragon.github.io/svg-overlay/openseadragon-svg-overlay.js"></script>
    <script>
        const viewer = OpenSeadragon({
            id: "viewer",
            prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/images/",
            tileSources: "output.dzi",
            gestureSettingsMouse: {
                clickToZoom: false,
                dblClickToZoom: false
            },
            smoothTileEdges: false,
            imageSmoothingEnabled: false,
            preloadCount: 20,
            imageLoaderLimit: 10,
            maxImageCacheCount: 500,
            timeout: 15000
        });
        let zoomStep = 2;
viewer.addHandler('open', function() {
    console.log("1. Обработчик начал работу");
    const homeZoom = viewer.viewport.getHomeZoom();    // Настройка зума
    const fullZoom = viewer.viewport.imageToViewportZoom(1);
    const zoomStep = Math.pow(fullZoom / homeZoom, 1 / 7);
    viewer.zoomPerClick = zoomStep;
    viewer.zoomPerScroll = zoomStep;
    window.zoomStep = zoomStep;
    console.log("2. Зум настроен");
    console.log("4. Начинаю создавать сетку");    // Создание сетки
    svgOverlay = viewer.svgOverlay();
    console.log("5. svgOverlay создан:", svgOverlay);
    const imageAspect = viewer.source.dimensions.y / viewer.source.dimensions.x;
    console.log("6. imageAspect =", imageAspect);
    const cols = 21;
    const rows = 20;
    console.log("7. Сетка", cols, "x", rows);
    let rectCount = 0;
    for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("x", col / cols);
            rect.setAttribute("y", (row / rows) * imageAspect);
            rect.setAttribute("width", 1 / cols);
            rect.setAttribute("height", (1 / rows) * imageAspect);
            rect.setAttribute("fill", "rgba(255, 255, 255, 0.01)");
            rect.setAttribute("stroke", "black");
            rect.setAttribute("stroke-width", "0.0005");
            rect.setAttribute("stroke-opacity", "1");
            rect.setAttribute("cursor", "pointer");
            rect.setAttribute("data-title", `Ячейка ${row+1}-${col+1}`);
            svgOverlay.node().appendChild(rect);
            rectCount++;
            rect.addEventListener('click', function(e) {
                e.stopPropagation();
                console.log("Клик по ячейке:", this.getAttribute("data-title"));
            });
        }
    }
    console.log("8. Создано прямоугольников:", rectCount);
    console.log("9. Всего в SVG:", document.querySelectorAll('svg rect').length);
});
        viewer.canvas.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            const currentZoom = viewer.viewport.getZoom();
            const minZoom = viewer.viewport.getHomeZoom();
            if (currentZoom <= minZoom) return false;
            const viewportPoint = viewer.viewport.pointFromPixel(new OpenSeadragon.Point(e.clientX, e.clientY));
            viewer.viewport.zoomBy(1 / zoomStep, viewportPoint);
            return false;
        });
        viewer.canvas.addEventListener('dblclick', function(e) {
            e.preventDefault();
            const viewportPoint = viewer.viewport.pointFromPixel(new OpenSeadragon.Point(e.clientX, e.clientY));
            viewer.viewport.zoomBy(zoomStep, viewportPoint);
        });
        let svgOverlay = null;
    </script>
</body>
</html>
