<script>
    const viewer = OpenSeadragon({
        id: "viewer",
        prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/images/",
        tileSources: "output5.dzi",
        gestureSettingsMouse: {
            clickToZoom: false,
            dblClickToZoom: false
        },
        smoothTileEdges: false,
        imageSmoothingEnabled: true,
        preloadCount: 20,
        imageLoaderLimit: 10,
        maxImageCacheCount: 500,
        timeout: 15000
    });

    let zoomStep = 2;
    let svgOverlay = null;

    // Единственный обработчик open
    viewer.addHandler('open', function() {
        // Настройка зума
        const homeZoom = viewer.viewport.getHomeZoom();
        const fullZoom = viewer.viewport.imageToViewportZoom(1);
        zoomStep = Math.pow(fullZoom / homeZoom, 1 / 7);
        viewer.zoomPerClick = zoomStep;
        viewer.zoomPerScroll = zoomStep;
        window.zoomStep = zoomStep;

        // --- ДОБАВЛЕНИЕ КНОПКИ В ПАНЕЛЬ УПРАВЛЕНИЯ ---
        function waitForZoomControls() {
            const zoomControls = document.querySelector('.openseadragon-zoom');
            if (zoomControls) {
                if (zoomControls.querySelector('.custom-home-button')) return;
                const myButton = document.createElement('button');
                myButton.className = 'custom-home-button';
                myButton.innerHTML = '⚡';
                myButton.title = 'Сброс вида';
                myButton.style.cssText = `
                    width: 28px;
                    height: 28px;
                    background: rgba(0,0,0,0.7);
                    border: 1px solid #ccc;
                    border-radius: 4px;
                    color: white;
                    cursor: pointer;
                    margin: 2px;
                    font-size: 16px;
                    line-height: 1;
                `;
                myButton.onclick = () => viewer.viewport.goHome();
                zoomControls.appendChild(myButton);
                console.log('✅ Кнопка добавлена');
            } else {
                console.log('⏳ .openseadragon-zoom ещё не создан, жду...');
                setTimeout(waitForZoomControls, 200);
            }
        }
        setTimeout(waitForZoomControls, 300);
    });

    // Правый клик = зум-аут
    viewer.canvas.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        const currentZoom = viewer.viewport.getZoom();
        const minZoom = viewer.viewport.getHomeZoom();
        if (currentZoom <= minZoom) return false;
        const viewportPoint = viewer.viewport.pointFromPixel(new OpenSeadragon.Point(e.clientX, e.clientY));
        viewer.viewport.zoomBy(1 / zoomStep, viewportPoint);
        return false;
    });

    // Двойной клик = зум-ин
    viewer.canvas.addEventListener('dblclick', function(e) {
        e.preventDefault();
        const viewportPoint = viewer.viewport.pointFromPixel(new OpenSeadragon.Point(e.clientX, e.clientY));
        viewer.viewport.zoomBy(zoomStep, viewportPoint);
    });
