<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Deep Zoom Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/openseadragon.min.css">
    <style>
        body { margin: 0; padding: 0; }
        #viewer { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="viewer"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/openseadragon.min.js"></script>
    <script>
        OpenSeadragon({
            id: "viewer",
            prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/images/",
            tileSources: "output.dzi",
            maxZoomLevel: 13
        });
    </script>

    <script>
const viewer = OpenSeadragon({
    id: "viewer",
    prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/images/",
    tileSources: "output.dzi",
    maxZoomLevel: 11,
    
    // Отключаем контекстное меню
    gestureSettingsMouse: {
        clickToZoom: false,
        dblClickToZoom: true,
        pinchToZoom: true,
        flickEnabled: true,
        // Отключаем правый клик
        rightClickToZoom: true  // Правый клик = зум аут
    }
});

// Дополнительная защита от контекстного меню на элементе
document.getElementById('viewer').addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
});
    </script>    
</body>
</html>
