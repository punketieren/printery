<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deep Zoom Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/openseadragon.min.css">
    <style>
        body { margin: 0; padding: 0; }
        #viewer { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="viewer"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/openseadragon.min.js"></script>
    <script>
        const viewer = OpenSeadragon({
            id: "viewer",
            prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/images/",
            tileSources: "output.dzi",
            maxZoomLevel: 11,
            dblClickToZoom: true,
            
            // Настройки четкости изображения
            smoothTileEdges: false,
            imageSmoothingEnabled: false,
            
            // Настройки загрузки
            preloadCount: 20,
            imageLoaderLimit: 10,
            maxImageCacheCount: 500,
            timeout: 15000
        });

        // Отключаем зум по одиночному клику
        viewer.addHandler('canvas-click', function(event) {
            event.preventDefaultAction = true;
        });

        // Настройка зума: двойной клик = 1 уровень папки
        viewer.addHandler('open', function() {
            const homeZoom = viewer.viewport.getHomeZoom();
            const fullZoom = viewer.viewport.imageToViewportZoom(1);
            viewer.zoomPerClick = Math.pow(fullZoom / homeZoom, 1 / 11);
        });

        // Правый клик = зум-аут с ограничением
        viewer.canvas.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            
            const currentZoom = viewer.viewport.getZoom();
            const minZoom = viewer.viewport.getHomeZoom();
            
            if (currentZoom <= minZoom) {
                return false;
            }
            
            const viewportPoint = viewer.viewport.pointFromPixel(new OpenSeadragon.Point(e.clientX, e.clientY));
            viewer.viewport.zoomBy(0.7, viewportPoint);
            return false;
        });
    </script>
</body>
</html>
