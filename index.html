<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Deep Zoom Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/openseadragon.min.css">
    <style>
        body { margin: 0; padding: 0; }
        #viewer { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="viewer"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/openseadragon.min.js"></script>
    <script>
        // --- 1. СОЗДАЕМ ПРОСМОТРЩИК ---
        const viewer = OpenSeadragon({
            id: "viewer",
            prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/3.1.0/images/",
            tileSources: "output.dzi"
        });
viewer.canvas.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    
    // Получаем текущий уровень зума
    const currentZoom = viewer.viewport.getZoom();
    // Получаем минимально допустимый уровень зума (тот, при котором изображение помещается на экране)
    const minZoom = viewer.viewport.getHomeZoom();
    
    // Если текущий зум уже равен минимальному, не делаем ничего
    if (currentZoom <= minZoom) {
        return false;
    }
    
    // Иначе делаем зум-аут
    var viewportPoint = viewer.viewport.pointFromPixel(new OpenSeadragon.Point(e.clientX, e.clientY));
    viewer.viewport.zoomBy(0.7, viewportPoint);
    return false;
});
        // --- 2. НАСТРАИВАЕМ ЛЕВЫЙ КЛИК: 1 КЛИК = 1 УРОВЕНЬ ПАПКИ ---
        // Этот код сработает, когда изображение загрузится
        viewer.addHandler('open', function() {
            const homeZoom = viewer.viewport.getHomeZoom();
            const fullZoom = viewer.viewport.imageToViewportZoom(1);
            // Рассчитываем шаг, чтобы пройти от начального до максимального уровня
            // ровно за maxZoomLevel (11) кликов
            viewer.zoomPerClick = Math.pow(fullZoom / homeZoom, 1 / 11);
        });

        // --- 3. НАСТРАИВАЕМ ПРАВЫЙ КЛИК: ОТКЛЮЧАЕМ МЕНЮ И ДЕЛАЕМ ZOOM OUT ---
        viewer.canvas.addEventListener('contextmenu', function(e) {
            e.preventDefault(); // Убираем контекстное меню
            // Переводим координаты мыши в координаты изображения
            var viewportPoint = viewer.viewport.pointFromPixel(new OpenSeadragon.Point(e.clientX, e.clientY));
            // Делаем зум аут (zoom out) на 30%
            viewer.viewport.zoomBy(0.7, viewportPoint);
            return false;
        });
    </script>
</body>
</html>
