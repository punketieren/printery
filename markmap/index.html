<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Collaborative WYSIWYG Editor (P2P)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f7fb; font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .toolbar { background: white; padding: 6px 12px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0; }
        .toolbar-group { display: flex; gap: 3px; align-items: center; background: #f8fafc; padding: 3px 6px; border-radius: 6px; }
        .toolbar button { background: white; border: 1px solid #cbd5e1; border-radius: 5px; cursor: pointer; font-size: 13px; min-width: 28px; padding: 4px 8px; }
        .toolbar button.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .toolbar select { background: white; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px; padding: 4px 6px; }
        .main-container { flex: 1; display: flex; gap: 10px; padding: 10px; overflow: hidden; }
        .editor-panel { flex: 1; display: flex; flex-direction: column; background: white; border-radius: 12px; overflow: hidden; }
        .viewer-panel { flex: 1; background: white; border-radius: 12px; overflow: hidden; position: relative; }
        #editor { height: 100%; }
        #markmap-container { width: 100%; height: 100%; }
        .status-bar { background: white; border-top: 1px solid #e2e8f0; padding: 6px 12px; font-size: 12px; display: flex; justify-content: space-between; }
        .ql-container { font-size: 16px; }
        .ql-editor { min-height: 100%; padding: 20px; }
    </style>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://unpkg.com/yjs@13.6.10/dist/yjs.min.js"></script>
    <script src="https://unpkg.com/y-webrtc@10.2.5/dist/y-webrtc.min.js"></script>
    <script src="https://unpkg.com/y-quill@0.7.3/dist/y-quill.min.js"></script>
    <script src="https://unpkg.com/marked@11.1.1/marked.min.js"></script>
    <script src="https://unpkg.com/turndown@7.1.2/dist/turndown.js"></script>
    <script src="https://unpkg.com/markmap-lib@0.15.3/dist/index.min.js"></script>
    <script src="https://unpkg.com/markmap-view@0.15.3/dist/index.min.js"></script>
</head>
<body>
    <div class="toolbar">
        <div class="toolbar-group">
            <select id="heading-select"><option value="">Абзац</option><option value="header1">H1</option><option value="header2">H2</option><option value="header3">H3</option></select>
        </div>
        <div class="toolbar-group">
            <button id="bold"><b>B</b></button>
            <button id="italic"><i>I</i></button>
            <button id="strike"><s>S</s></button>
            <button id="code">&lt;/&gt;</button>
            <button id="highlight"><mark>H</mark></button>
        </div>
        <div class="toolbar-group">
            <button id="ul">•</button>
            <button id="ol">1.</button>
            <button id="quote">"</button>
        </div>
        <div class="toolbar-group">
            <button id="link">🔗</button>
            <button id="image">🖼️</button>
            <button id="formula">∑</button>
        </div>
        <div class="toolbar-group">
            <button id="save">💾</button>
            <button id="load">📂</button>
        </div>
    </div>
    <div class="main-container">
        <div class="editor-panel">
            <div id="editor"></div>
        </div>
        <div class="viewer-panel">
            <div id="markmap-container"></div>
        </div>
    </div>
    <div class="status-bar">
        <span>🤝 Совместный редактор (P2P)</span>
        <span id="status">Подключение...</span>
    </div>

    <script>
        // --- Настройка коллабораций через WebRTC (без своего сервера) ---
        const ydoc = new Y.Doc();
        // Используем публичный сигнальный сервер y-webrtc
        const provider = new Y.WebRTCProvider('markmap-room', ydoc, {
            signaling: ['wss://signaling.yjs.dev']
        });
        const yText = ydoc.getText('quill');
        
        // --- Инициализация Quill ---
        const editor = new Quill('#editor', {
            theme: 'snow',
            placeholder: 'Начните писать...',
            modules: { toolbar: false }
        });
        
        const binding = new Y.QuillBinding(yText, editor);
        
        // --- Статус подключения ---
        provider.on('status', (event) => {
            const statusSpan = document.getElementById('status');
            if (event.connected) {
                statusSpan.innerHTML = '🟢 Совместный режим (P2P, подключено)';
                statusSpan.style.color = 'green';
            } else {
                statusSpan.innerHTML = '🟡 Поиск участников...';
                statusSpan.style.color = 'orange';
            }
        });
        
        // --- Форматирование ---
        document.getElementById('bold').onclick = () => editor.format('bold', !editor.getFormat().bold);
        document.getElementById('italic').onclick = () => editor.format('italic', !editor.getFormat().italic);
        document.getElementById('strike').onclick = () => editor.format('strike', !editor.getFormat().strike);
        document.getElementById('code').onclick = () => editor.format('code', !editor.getFormat().code);
        document.getElementById('highlight').onclick = () => {
            const range = editor.getSelection();
            if (range) {
                const text = editor.getText(range.index, range.length);
                editor.deleteText(range.index, range.length);
                editor.insertText(range.index, text, { background: '#fef08a' });
            }
        };
        document.getElementById('ul').onclick = () => editor.format('list', 'bullet');
        document.getElementById('ol').onclick = () => editor.format('list', 'ordered');
        document.getElementById('quote').onclick = () => editor.format('blockquote', !editor.getFormat().blockquote);
        document.getElementById('heading-select').onchange = (e) => {
            const value = e.target.value;
            if (value === 'header1') editor.format('header', 1);
            else if (value === 'header2') editor.format('header', 2);
            else if (value === 'header3') editor.format('header', 3);
            else editor.format('header', false);
            e.target.value = '';
        };
        document.getElementById('link').onclick = () => {
            const url = prompt('Введите URL:');
            if (url) editor.format('link', url);
        };
        document.getElementById('image').onclick = () => {
            const url = prompt('Введите URL изображения:');
            if (url) {
                const range = editor.getSelection();
                editor.insertEmbed(range.index, 'image', url);
            }
        };
        document.getElementById('formula').onclick = () => {
            const range = editor.getSelection();
            editor.insertText(range.index, '$$Формула$$');
        };
        
        // --- Конвертация Quill → Markdown (упрощённая) ---
        function deltaToMarkdown(delta) {
            let md = '';
            for (let op of delta.ops) {
                if (op.insert) {
                    let text = op.insert;
                    if (typeof text !== 'string') continue;
                    if (op.attributes) {
                        if (op.attributes.bold) text = `**${text}**`;
                        if (op.attributes.italic) text = `*${text}*`;
                        if (op.attributes.strike) text = `~~${text}~~`;
                        if (op.attributes.code) text = `\`${text}\``;
                        if (op.attributes.background === '#fef08a') text = `==${text}==`;
                        if (op.attributes.header === 1) text = `# ${text}`;
                        if (op.attributes.header === 2) text = `## ${text}`;
                        if (op.attributes.header === 3) text = `### ${text}`;
                        if (op.attributes.link) text = `[${text}](${op.attributes.link})`;
                    }
                    md += text;
                } else if (op.attributes && op.attributes.list === 'bullet') {
                    md += `\n- `;
                }
            }
            return md;
        }
        
        // --- Обновление Markmap ---
        let currentMarkmap = null;
        function updateMarkmap() {
            const delta = editor.getContents();
            const markdown = deltaToMarkdown(delta);
            const container = document.getElementById('markmap-container');
            if (!container) return;
            try {
                const transformer = new markmap.Transformer();
                const { root } = transformer.transform(markdown || '# Пусто');
                while (container.firstChild) container.removeChild(container.firstChild);
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.style.width = '100%';
                svg.style.height = '100%';
                container.appendChild(svg);
                if (currentMarkmap) currentMarkmap.destroy?.();
                currentMarkmap = markmap.Markmap.create(svg, null, root);
            } catch(e) { console.warn(e); }
        }
        
        editor.on('text-change', () => updateMarkmap());
        setTimeout(updateMarkmap, 500);
        
        // --- Сохранение и загрузка ---
        const turndown = new TurndownService();
        document.getElementById('save').onclick = () => {
            const html = editor.root.innerHTML;
            const md = turndown.turndown(html);
            const blob = new Blob([md], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'document.md';
            a.click();
            URL.revokeObjectURL(url);
        };
        document.getElementById('load').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.md,.txt';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const md = ev.target.result;
                    const html = marked.parse(md);
                    editor.root.innerHTML = html;
                };
                reader.readAsText(file);
            };
            input.click();
        };
        
        // Активные кнопки
        function updateActiveButtons() {
            const format = editor.getFormat();
            document.getElementById('bold').classList.toggle('active', format.bold);
            document.getElementById('italic').classList.toggle('active', format.italic);
            document.getElementById('strike').classList.toggle('active', format.strike);
            document.getElementById('code').classList.toggle('active', format.code);
            document.getElementById('ul').classList.toggle('active', format.list === 'bullet');
            document.getElementById('ol').classList.toggle('active', format.list === 'ordered');
            document.getElementById('quote').classList.toggle('active', format.blockquote);
        }
        editor.on('selection-change', updateActiveButtons);
        editor.on('text-change', updateActiveButtons);
    </script>
</body>
</html>
