<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ProseMirror WYSIWYG + Markmap</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f7fb; font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .toolbar { background: white; padding: 6px 12px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0; position: sticky; top: 0; z-index: 10; }
        .toolbar-group { display: flex; gap: 3px; align-items: center; background: #f8fafc; padding: 3px 6px; border-radius: 6px; }
        .toolbar button { background: white; border: 1px solid #cbd5e1; border-radius: 5px; cursor: pointer; font-size: 13px; min-width: 28px; padding: 4px 8px; }
        .toolbar button.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .toolbar select { background: white; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px; padding: 4px 6px; }
        .container { flex: 1; display: flex; gap: 10px; padding: 10px; overflow: hidden; }
        .editor-panel { flex: 1; display: flex; flex-direction: column; background: white; border-radius: 12px; overflow: hidden; }
        .viewer-panel { flex: 1; background: white; border-radius: 12px; overflow: hidden; position: relative; }
        .ProseMirror { height: 100%; overflow-y: auto; padding: 20px; outline: none; font-size: 16px; line-height: 1.5; }
        .ProseMirror h1 { font-size: 2em; margin: 0.5em 0; }
        .ProseMirror h2 { font-size: 1.5em; margin: 0.5em 0; }
        .ProseMirror h3 { font-size: 1.25em; margin: 0.5em 0; }
        .ProseMirror ul, .ProseMirror ol { padding-left: 2em; margin: 0.5em 0; }
        .ProseMirror blockquote { border-left: 4px solid #3b82f6; margin: 0.5em 0; padding-left: 1em; color: #555; }
        .ProseMirror code { background: #f1f5f9; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
        .ProseMirror pre { background: #f1f5f9; padding: 12px; border-radius: 8px; overflow-x: auto; }
        .ProseMirror pre code { background: none; padding: 0; }
        .ProseMirror mark { background: #fef08a; }
        #markmap-container { width: 100%; height: 100%; }
        .status-bar { background: white; border-top: 1px solid #e2e8f0; padding: 6px 12px; font-size: 12px; display: flex; justify-content: space-between; }
    </style>
    <!-- ProseMirror dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-model@1.19.3/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-state@1.4.3/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-view@1.32.7/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-schema-basic@1.2.2/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-schema-list@1.3.0/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-commands@1.5.2/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-keymap@1.2.2/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-history@1.3.2/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-inputrules@1.3.0/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-markdown@1.11.2/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.3/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.3/dist/index.min.js"></script>
</head>
<body>
<div class="toolbar">
    <div class="toolbar-group">
        <select id="heading-select"><option value="">Абзац</option><option value="h1">H1</option><option value="h2">H2</option><option value="h3">H3</option></select>
    </div>
    <div class="toolbar-group">
        <button id="bold"><b>B</b></button>
        <button id="italic"><i>I</i></button>
        <button id="strike"><s>S</s></button>
        <button id="code-inline">&lt;/&gt;</button>
        <button id="highlight"><mark>H</mark></button>
    </div>
    <div class="toolbar-group">
        <button id="ul">•</button>
        <button id="ol">1.</button>
        <button id="quote">"</button>
    </div>
    <div class="toolbar-group">
        <button id="link">🔗</button>
        <button id="image">🖼️</button>
        <button id="hr">—</button>
    </div>
    <div class="toolbar-group">
        <button id="save-btn">💾 Сохранить</button>
        <button id="load-btn">📂 Загрузить</button>
    </div>
</div>
<div class="container">
    <div class="editor-panel">
        <div id="editor"></div>
    </div>
    <div class="viewer-panel">
        <div id="markmap-container"></div>
    </div>
</div>
<div class="status-bar">
    <span>✏️ ProseMirror WYSIWYG + Markmap (без коллабораций)</span>
    <span id="status">Готов</span>
</div>

<script>
    // --- Инициализация ProseMirror ---
    const { schema } = prosemirrorSchemaBasic;
    const { addListNodes } = prosemirrorSchemaList;
    const { EditorState } = prosemirrorState;
    const { EditorView } = prosemirrorView;
    const { keymap } = prosemirrorKeymap;
    const { history } = prosemirrorHistory;
    const { baseKeymap, toggleMark, wrapIn, setBlockType } = prosemirrorCommands;
    const { buildInputRules } = prosemirrorInputrules;

    // Расширяем схему поддержкой списков
    const mySchema = addListNodes(schema, 'paragraph block*', 'block');

    // Начальный документ в формате JSON
    const initialDoc = {
        type: 'doc',
        content: [
            { type: 'heading', attrs: { level: 1 }, content: [{ type: 'text', text: 'Центральная идея' }] },
            { type: 'heading', attrs: { level: 2 }, content: [{ type: 'text', text: 'Основной раздел 1' }] },
            { type: 'heading', attrs: { level: 3 }, content: [{ type: 'text', text: 'Деталь 1.1' }] },
            { type: 'heading', attrs: { level: 3 }, content: [{ type: 'text', text: 'Деталь 1.2' }] },
            { type: 'paragraph', content: [
                { type: 'text', marks: [{ type: 'strong' }], text: 'Жирный' },
                { type: 'text', text: ' и ' },
                { type: 'text', marks: [{ type: 'em' }], text: 'курсив' },
                { type: 'text', text: ' и ' },
                { type: 'text', marks: [{ type: 'strike' }], text: 'зачёркнутый' }
            ] },
            { type: 'bullet_list', content: [
                { type: 'list_item', content: [{ type: 'paragraph', content: [{ type: 'text', text: 'Список 1' }] }] },
                { type: 'list_item', content: [{ type: 'paragraph', content: [{ type: 'text', text: 'Список 2' }] }] }
            ] },
            { type: 'ordered_list', content: [
                { type: 'list_item', content: [{ type: 'paragraph', content: [{ type: 'text', text: 'Нумерованный 1' }] }] },
                { type: 'list_item', content: [{ type: 'paragraph', content: [{ type: 'text', text: 'Нумерованный 2' }] }] }
            ] },
            { type: 'blockquote', content: [{ type: 'paragraph', content: [{ type: 'text', text: 'Цитата' }] }] },
            { type: 'paragraph', content: [{ type: 'text', marks: [{ type: 'code' }], text: 'код' }] },
            { type: 'horizontal_rule' }
        ]
    };

    let view = null;
    let markdownCache = '';
    let markmapTransformer = null;
    let markmapView = null;
    let currentMarkmap = null;

    // Конвертация ProseMirror -> Markdown
    function getMarkdown() {
        const { defaultMarkdownParser, defaultMarkdownSerializer } = prosemirrorMarkdown;
        const parser = defaultMarkdownParser;
        const serializer = defaultMarkdownSerializer;
        const doc = view.state.doc;
        return serializer.serialize(doc);
    }

    // Обновление Markmap
    function updateMarkmap() {
        if (!markmapTransformer || !markmapView) return;
        const md = getMarkdown();
        if (md === markdownCache) return;
        markdownCache = md;
        const container = document.getElementById('markmap-container');
        if (!container) return;
        try {
            const transformer = new markmapTransformer();
            const { root } = transformer.transform(md || '# Пусто');
            while (container.firstChild) container.removeChild(container.firstChild);
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.style.width = '100%';
            svg.style.height = '100%';
            container.appendChild(svg);
            if (currentMarkmap) currentMarkmap.destroy?.();
            currentMarkmap = markmapView.create(svg, null, root);
        } catch(e) { console.warn('Markmap error', e); }
    }

    // Обработчик изменений
    function onUpdate() {
        updateMarkmap();
        updateActiveButtons();
    }

    // Команды для кнопок
    function format(command, value = null) {
        const { toggleMark, setBlockType, wrapIn } = prosemirrorCommands;
        const { chainCommands } = prosemirrorCommands;
        if (command === 'bold') {
            toggleMark(mySchema.marks.strong)(view.state, view.dispatch);
        } else if (command === 'italic') {
            toggleMark(mySchema.marks.em)(view.state, view.dispatch);
        } else if (command === 'strike') {
            toggleMark(mySchema.marks.strike)(view.state, view.dispatch);
        } else if (command === 'code') {
            toggleMark(mySchema.marks.code)(view.state, view.dispatch);
        } else if (command === 'heading') {
            setBlockType(mySchema.nodes.heading, { level: value })(view.state, view.dispatch);
        } else if (command === 'paragraph') {
            setBlockType(mySchema.nodes.paragraph)(view.state, view.dispatch);
        } else if (command === 'bullet_list') {
            wrapIn(mySchema.nodes.bullet_list)(view.state, view.dispatch);
        } else if (command === 'ordered_list') {
            wrapIn(mySchema.nodes.ordered_list)(view.state, view.dispatch);
        } else if (command === 'blockquote') {
            wrapIn(mySchema.nodes.blockquote)(view.state, view.dispatch);
        } else if (command === 'horizontal_rule') {
            const { EditorState } = prosemirrorState;
            const tr = view.state.tr.replaceSelectionWith(mySchema.nodes.horizontal_rule.create());
            view.dispatch(tr);
        }
        view.focus();
        onUpdate();
    }

    // Обновление активных кнопок
    function updateActiveButtons() {
        const { selection } = view.state;
        const marks = selection.$from.marks();
        const activeBold = marks.some(m => m.type === mySchema.marks.strong);
        const activeItalic = marks.some(m => m.type === mySchema.marks.em);
        const activeStrike = marks.some(m => m.type === mySchema.marks.strike);
        const activeCode = marks.some(m => m.type === mySchema.marks.code);
        document.getElementById('bold').classList.toggle('active', activeBold);
        document.getElementById('italic').classList.toggle('active', activeItalic);
        document.getElementById('strike').classList.toggle('active', activeStrike);
        document.getElementById('code-inline').classList.toggle('active', activeCode);
        // Списки и цитаты — можно добавить позже
    }

    // Создание редактора
    const state = EditorState.create({
        schema: mySchema,
        doc: mySchema.nodeFromJSON(initialDoc),
        plugins: [
            history(),
            keymap(baseKeymap),
            buildInputRules(),
            keymap({
                'Mod-b': () => toggleMark(mySchema.marks.strong)(view.state, view.dispatch),
                'Mod-i': () => toggleMark(mySchema.marks.em)(view.state, view.dispatch)
            })
        ]
    });

    view = new EditorView(document.getElementById('editor'), {
        state: state,
        dispatchTransaction(tr) {
            const newState = view.state.apply(tr);
            view.updateState(newState);
            onUpdate();
        }
    });

    // Назначение кнопок
    document.getElementById('heading-select').onchange = (e) => {
        const value = e.target.value;
        if (value === '') format('paragraph');
        else if (value === 'h1') format('heading', 1);
        else if (value === 'h2') format('heading', 2);
        else if (value === 'h3') format('heading', 3);
        e.target.value = '';
    };
    document.getElementById('bold').onclick = () => format('bold');
    document.getElementById('italic').onclick = () => format('italic');
    document.getElementById('strike').onclick = () => format('strike');
    document.getElementById('code-inline').onclick = () => format('code');
    document.getElementById('highlight').onclick = () => {
        // Временная подсветка через атрибут
        const { toggleMark } = prosemirrorCommands;
        const mark = mySchema.marks.span;
        toggleMark(mark)(view.state, view.dispatch);
        view.focus();
        onUpdate();
    };
    document.getElementById('ul').onclick = () => format('bullet_list');
    document.getElementById('ol').onclick = () => format('ordered_list');
    document.getElementById('quote').onclick = () => format('blockquote');
    document.getElementById('link').onclick = () => {
        let url = prompt('Введите URL:');
        if (url) {
            const { toggleMark } = prosemirrorCommands;
            const mark = mySchema.marks.link;
            toggleMark(mark, { href: url })(view.state, view.dispatch);
            view.focus();
            onUpdate();
        }
    };
    document.getElementById('image').onclick = () => {
        let url = prompt('Введите URL изображения:');
        if (url) {
            const { insertImage } = prosemirrorCommands;
            insertImage(view.state, view.dispatch, view, url);
            view.focus();
            onUpdate();
        }
    };
    document.getElementById('hr').onclick = () => format('horizontal_rule');
    document.getElementById('save-btn').onclick = () => {
        const md = getMarkdown();
        const blob = new Blob([md], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'document.md';
        a.click();
        URL.revokeObjectURL(url);
        document.getElementById('status').innerText = '✅ Сохранено';
        setTimeout(() => document.getElementById('status').innerText = 'Готов', 1500);
    };
    document.getElementById('load-btn').onclick = () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.md,.txt';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const md = ev.target.result;
                const { defaultMarkdownParser } = prosemirrorMarkdown;
                const doc = defaultMarkdownParser.parse(md);
                const tr = view.state.tr.replaceWith(0, view.state.doc.content.size, doc);
                view.dispatch(tr);
                updateMarkmap();
                document.getElementById('status').innerText = '✅ Загружено';
                setTimeout(() => document.getElementById('status').innerText = 'Готов', 1500);
            };
            reader.readAsText(file);
        };
        input.click();
    };

    // Инициализация Markmap
    setTimeout(() => {
        if (typeof markmap !== 'undefined') {
            markmapTransformer = markmap.Transformer;
            markmapView = markmap.Markmap;
            updateMarkmap();
        }
    }, 500);
    updateActiveButtons();
    document.getElementById('status').innerText = 'Готов';
</script>
</body>
</html>
