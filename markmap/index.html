<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Milkdown Collaborative + Markmap</title>
    <!-- Стили Milkdown -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/milkdown@7.6.2/lib/theme/common/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/milkdown@7.6.2/lib/theme/nord/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f7fb;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        .toolbar {
            background: white;
            padding: 8px 16px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            z-index: 10;
        }
        .toolbar button {
            padding: 4px 12px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .toolbar button.primary {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        .toolbar .status {
            margin-left: auto;
            font-size: 12px;
            color: #475569;
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .main-container {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }
        /* Сворачиваемая панель редактора */
        .editor-panel {
            position: absolute;
            left: 0;
            top: 0;
            width: 50%;
            height: 100%;
            background: white;
            border-right: 1px solid #e2e8f0;
            z-index: 20;
            transform: translateX(0);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
        }
        .editor-panel.collapsed {
            transform: translateX(-100%);
        }
        .toggle-editor {
            position: absolute;
            left: calc(50% + 10px);
            top: 20px;
            width: 32px;
            height: 32px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: left 0.3s ease;
        }
        .editor-panel.collapsed + .toggle-editor {
            left: 10px;
        }
        #editor-container {
            flex: 1;
            overflow: auto;
            padding: 16px;
        }
        .milkdown {
            max-width: 800px;
            margin: 0 auto;
            background: white;
        }
        /* Панель просмотра карты */
        .viewer-panel {
            flex: 1;
            background: white;
            overflow: hidden;
            position: relative;
            margin-left: 0;
            transition: margin-left 0.3s ease;
        }
        .viewer-panel.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background: white;
        }
        .fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            z-index: 30;
            font-size: 20px;
        }
        .map-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            display: flex;
            gap: 5px;
            padding: 5px;
            z-index: 30;
        }
        .map-controls button {
            width: 32px;
            height: 32px;
            border: none;
            background: #f8fafc;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        #markmap-container {
            width: 100%;
            height: 100%;
        }
        #markmap-container svg {
            width: 100%;
            height: 100%;
        }
        @media (max-width: 768px) {
            .editor-panel { width: 100%; }
            .toggle-editor { left: calc(100% - 40px); top: 70px; }
            .editor-panel.collapsed + .toggle-editor { left: 10px; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button id="save-btn" class="primary">💾 Сохранить MD</button>
        <button id="load-btn">📂 Загрузить MD</button>
        <button id="print-btn">🖨️ Печать</button>
        <span class="status" id="status-text">🔄 Инициализация...</span>
    </div>
    <div class="main-container">
        <div id="editor-panel" class="editor-panel">
            <div id="editor-container"></div>
        </div>
        <button id="toggle-editor" class="toggle-editor" title="Скрыть/показать редактор">◀</button>
        <div id="viewer-panel" class="viewer-panel">
            <div id="markmap-container"></div>
            <button id="fullscreen-btn" class="fullscreen-btn" title="Полноэкранный режим">⛶</button>
            <div class="map-controls">
                <button id="collapse-all" title="Свернуть все ветки">−</button>
                <button id="expand-all" title="Развернуть все ветки">+</button>
            </div>
        </div>
    </div>

    <!-- Импорт карт и зависимостей -->
    <script type="importmap">
        {
            "imports": {
                "milkdown": "https://esm.sh/@milkdown/core@7.6.2",
                "@milkdown/theme-nord": "https://esm.sh/@milkdown/theme-nord@7.6.2",
                "@milkdown/preset-commonmark": "https://esm.sh/@milkdown/preset-commonmark@7.6.2",
                "@milkdown/plugin-toolbar": "https://esm.sh/@milkdown/plugin-toolbar@7.6.2",
                "@milkdown/plugin-history": "https://esm.sh/@milkdown/plugin-history@7.6.2",
                "@milkdown/plugin-cursor": "https://esm.sh/@milkdown/plugin-cursor@7.6.2",
                "@milkdown/prose": "https://esm.sh/@milkdown/prose@7.6.2",
                "@milkdown/utils": "https://esm.sh/@milkdown/utils@7.6.2",
                "@milkdown/transformer": "https://esm.sh/@milkdown/transformer@7.6.2",
                "yjs": "https://esm.sh/yjs@13.6.10",
                "y-websocket": "https://esm.sh/y-websocket@2.0.1",
                "@milkdown/plugin-collab": "https://esm.sh/@milkdown/plugin-collab@7.6.2"
            }
        }
    </script>
    <script type="module">
        import { Editor } from 'milkdown';
        import { nord } from '@milkdown/theme-nord';
        import { commonmark } from '@milkdown/preset-commonmark';
        import { history } from '@milkdown/plugin-history';
        import { cursor } from '@milkdown/plugin-cursor';
        import { collab } from '@milkdown/plugin-collab';
       import * as Y from 'yjs';
        import { WebsocketProvider } from 'y-websocket';

        // === 1. Настройка коллабораций ===
        // Используем публичный WebSocket-сервер y-websocket (можно заменить на свой)
        const roomName = 'wysiwyg-markmap-room-v1';
        const ydoc = new Y.Doc();
        const provider = new WebsocketProvider('wss://yjs.dev', roomName, ydoc);
        const yXmlFragment = ydoc.getXmlFragment('milkdown');

        // === 2. Элементы UI ===
        const container = document.getElementById('editor-container');
        const statusSpan = document.getElementById('status-text');
        const editorPanel = document.getElementById('editor-panel');
        const viewerPanel = document.getElementById('viewer-panel');
        const toggleBtn = document.getElementById('toggle-editor');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const collapseAllBtn = document.getElementById('collapse-all');
        const expandAllBtn = document.getElementById('expand-all');

        let editor = null;
        let currentMarkmap = null;

        // === 3. Функция обновления Markmap ===
        async function updateMarkmap() {
            if (!editor) return;
            // Получаем Markdown из редактора
            const markdown = await editor.action((ctx) => {
                const doc = ctx.get('doc');
                const transformer = ctx.get('transformer');
                return transformer.toMarkdown(doc);
            });
            const containerMap = document.getElementById('markmap-container');
            if (!containerMap) return;
            try {
                const { Transformer } = await import('https://esm.sh/markmap-lib@0.15.3');
                const { Markmap } = await import('https://esm.sh/markmap-view@0.15.3');
                const transformer = new Transformer();
                const { root } = transformer.transform(markdown || '# Пусто');
                while (containerMap.firstChild) containerMap.removeChild(containerMap.firstChild);
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.style.width = '100%';
                svg.style.height = '100%';
                containerMap.appendChild(svg);
                if (currentMarkmap) currentMarkmap.destroy?.();
                currentMarkmap = Markmap.create(svg, null, root);
            } catch (err) {
                console.warn('Markmap error', err);
            }
        }

        // === 4. Инициализация Milkdown с коллаборацией ===
        async function initEditor() {
            editor = await Editor
                .make()
                .config(nord)
                .use(commonmark)
                .use(history)
                .use(cursor)
                .use(collab)
                .config((ctx) => {
                    // Подключаем Yjs документ
                    ctx.set(collab.key, {
                        doc: ydoc,
                        fragment: yXmlFragment,
                        field: 'default'
                    });
                })
                .create(container);
            
            // При изменении документа обновляем карту
            editor.on('update', () => updateMarkmap());
            
            // Загружаем начальный контент (пустой, можно задать)
            const initialContent = `# Центральная идея
## Основной раздел 1
### Деталь 1.1
### Деталь 1.2
## Основной раздел 2
### Деталь 2.1
### Деталь 2.2
- Элемент списка 1
- Элемент списка 2

**Жирный** и *курсив*.
[Ссылка](https://example.com)`;
            
            // Если документ пуст, заполняем начальным содержимым
            const currentText = await editor.action((ctx) => {
                const doc = ctx.get('doc');
                const transformer = ctx.get('transformer');
                return transformer.toMarkdown(doc);
            });
            if (!currentText || currentText.trim() === '') {
                await editor.action((ctx) => {
                    const transformer = ctx.get('transformer');
                    const doc = transformer.toHTML(initialContent);
                    ctx.get('doc').setContent(doc);
                });
            }
            
            statusSpan.innerText = '🟢 Совместный режим (подключено)';
            updateMarkmap();
        }

        // === 5. Сохранение Markdown ===
        async function saveMarkdown() {
            const md = await editor.action((ctx) => {
                const doc = ctx.get('doc');
                const transformer = ctx.get('transformer');
                return transformer.toMarkdown(doc);
            });
            const blob = new Blob([md], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'document.md';
            a.click();
            URL.revokeObjectURL(url);
            statusSpan.innerText = '✅ Сохранено';
            setTimeout(() => statusSpan.innerText = '🟢 Совместный режим', 1500);
        }

        // === 6. Загрузка из Markdown файла ===
        function loadMarkdownFromFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.md,.txt';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const content = ev.target.result;
                    // Вставляем контент в редактор
                    await editor.action((ctx) => {
                        const transformer = ctx.get('transformer');
                        const doc = transformer.toHTML(content);
                        ctx.get('doc').setContent(doc);
                    });
                    statusSpan.innerText = '✅ Загружено';
                    setTimeout(() => statusSpan.innerText = '🟢 Совместный режим', 1500);
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // === 7. Печать ===
        async function printDocument() {
            const markdown = await editor.action((ctx) => {
                const doc = ctx.get('doc');
                const transformer = ctx.get('transformer');
                return transformer.toMarkdown(doc);
            });
            // Преобразуем markdown в html для печати (простой способ)
            const html = markdown.replace(/^# (.*$)/gm, '<h1>$1</h1>')
                .replace(/^## (.*$)/gm, '<h2>$1</h2>')
                .replace(/^### (.*$)/gm, '<h3>$1</h3>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/^- (.*$)/gm, '<ul><li>$1</li></ul>')
                .replace(/^\d+\. (.*$)/gm, '<ol><li>$1</li></ol>')
                .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2">$1</a>')
                .replace(/\n/g, '<br>');
            const win = window.open('', '_blank');
            win.document.write(`
                <html>
                <head><title>Документ</title>
                <style>body { font-family: 'Times New Roman', serif; margin: 40px; } h1,h2,h3 { margin: 10px 0; } ul,ol { margin: 10px 0; }</style>
                </head>
                <body>${html}</body>
                </html>
            `);
            win.document.close();
            win.print();
        }

        // === 8. Управление панелями ===
        toggleBtn.onclick = () => {
            editorPanel.classList.toggle('collapsed');
            toggleBtn.textContent = editorPanel.classList.contains('collapsed') ? '▶' : '◀';
            setTimeout(() => updateMarkmap(), 300);
        };
        fullscreenBtn.onclick = () => {
            viewerPanel.classList.toggle('fullscreen');
            fullscreenBtn.textContent = viewerPanel.classList.contains('fullscreen') ? '✕' : '⛶';
            if (!editorPanel.classList.contains('collapsed')) {
                editorPanel.classList.add('collapsed');
                toggleBtn.textContent = '▶';
            }
            setTimeout(() => updateMarkmap(), 100);
        };

        // === 9. Управление ветками карты ===
        async function collapseAll() {
            if (currentMarkmap && currentMarkmap.state?.data) {
                const collapseNode = (node) => {
                    if (node.children) {
                        node.state = node.state || {};
                        node.state.collapsed = true;
                        node.children.forEach(collapseNode);
                    }
                };
                collapseNode(currentMarkmap.state.data);
                currentMarkmap.render();
            }
        }
        async function expandAll() {
            if (currentMarkmap && currentMarkmap.state?.data) {
                const expandNode = (node) => {
                    if (node.children) {
                        node.state = node.state || {};
                        node.state.collapsed = false;
                        node.children.forEach(expandNode);
                    }
                };
                expandNode(currentMarkmap.state.data);
                currentMarkmap.render();
            }
        }
        collapseAllBtn.onclick = collapseAll;
        expandAllBtn.onclick = expandAll;

        // === 10. Статус подключения ===
        provider.on('status', (event) => {
            if (event.status === 'connected') {
                statusSpan.innerText = '🟢 Совместный режим (подключено)';
            } else {
                statusSpan.innerText = '🟡 Ожидание подключения...';
            }
        });

        // Запуск
        initEditor().catch(console.error);
        document.getElementById('save-btn').onclick = saveMarkdown;
        document.getElementById('load-btn').onclick = loadMarkdownFromFile;
        document.getElementById('print-btn').onclick = printDocument;
    </script>
</body>
</html>
