<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ProseMirror WYSIWYG + Markmap</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/markdown/markdown.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-model@1.19.3/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-state@1.4.3/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-view@1.32.7/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-schema-basic@1.2.2/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-schema-list@1.3.0/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-commands@1.5.2/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-keymap@1.2.2/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-history@1.3.2/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-inputrules@1.3.0/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prosemirror-markdown@1.11.2/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.3/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.3/dist/index.min.js"></script>
</head>
<body>
<div class="container">
    <div class="editor-panel" id="editor-panel">
        <button class="collapse-btn" id="collapse-editor" title="Свернуть/развернуть">◀</button>
        <div class="panel-content">
            <div class="editor-toolbar">
                <span id="heading-level" style="margin:0 4px; font-size:13px;">-</span>
                <div class="heading-stack">
                    <button id="heading-up" title="Повысить уровень"><img src="img/heading-up.svg" alt="▲"></button>
                    <button id="heading-down" title="Понизить уровень"><img src="img/heading-down.svg" alt="▼"></button>
                </div>
                <button id="undo" title="Отменить (Ctrl+Z)"><img src="img/undo.svg" alt="↩️"></button>
                <button id="redo" title="Повторить (Ctrl+Y)"><img src="img/redo.svg" alt="↪️"></button>
                <button id="ul" title="Маркированный список"><img src="img/ul.svg" alt="•"></button>
                <button id="ol" title="Нумерованный список"><img src="img/ol.svg" alt="1."></button>
                <button id="quote" title="Цитата"><img src="img/quote.svg" alt='"'> </button>
                <button id="code-block" title="Блок кода"><img src="img/code-block.svg" alt="{ }"></button>
                <button id="strike" title="Зачёркнутый"><img src="img/strike.svg" alt="S"></button>
                <div class="dropdown">
                    <button><img src="img/menu-down.svg" alt="▼"></button>
                    <div class="dropdown-content">
                        <button id="bold"><img src="img/bold.svg" alt="B"></button>
                        <button id="italic"><img src="img/italic.svg" alt="I"></button>
                        <button id="code-inline"><img src="img/code-inline.svg" alt="<>"></button>
                        <button id="highlight"><img src="img/highlight.svg" alt="H"></button>
                    </div>
                </div>
                <div class="dropdown">
                    <button><img src="img/menu-dots.svg" alt="⋯"></button>
                    <div class="dropdown-content">
                        <button id="link"><img src="img/link.svg" alt="🔗"></button>
                        <button id="hr"><img src="img/hr.svg" alt="—"></button>
                        <button id="save-btn"><img src="img/save.svg" alt="💾"></button>
                        <button id="load-btn"><img src="img/load.svg" alt="📂"></button>
                    </div>
                </div>
            </div>
            <div id="editor" style="flex:1;"></div>
            <div class="editor-status-bar">
                <div class="mode-switch">
                    <label><input type="radio" name="editor-mode" value="wysiwyg" checked> WYSIWYG</label>
                    <label><input type="radio" name="editor-mode" value="markdown"> Markdown</label>
                </div>
                <div class="editor-inline-status" id="editor-inline-status">Редактор готов</div>
            </div>
        </div>
    </div>
    <div class="viewer-panel" id="viewer-panel">
        <div class="map-toolbar">
            <button id="fit-btn" title="Подогнать карту"><img src="img/fit.svg" alt="fit"> Подогнать</button>
            <button id="fullscreen-map" title="Полный экран"><img src="img/fullscreen.svg" alt="⛶"> На весь экран</button>
            <button id="save-png" title="Сохранить как PNG"><img src="img/save-png.svg" alt="PNG"> PNG</button>
        </div>
        <div id="markmap-container"></div>
    </div>
</div>
<div class="global-status" id="global-status">Готов</div>

<script src="bundle.js"></script>
<script src="app.js"></script>
</body>
</html>
