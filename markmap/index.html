<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ProseMirror Editor</title>
    <style>
        body { margin: 0; padding: 20px; display: flex; gap: 20px; font-family: system-ui; }
        #editor { flex: 1; border: 1px solid #ccc; min-height: 500px; }
        #markmap-container { flex: 1; border: 1px solid #ccc; }
        .toolbar { margin-bottom: 10px; display: flex; gap: 5px; }
        button { padding: 4px 8px; }
    </style>
</head>
<body>
<div style="width: 100%;">
    <div class="toolbar">
        <button id="bold"><b>B</b></button>
        <button id="italic"><i>I</i></button>
    </div>
    <div style="display: flex; gap: 20px;">
        <div id="editor"></div>
        <div id="markmap-container"></div>
    </div>
</div>
<script src="bundle.js"></script>
<script>
    document.getElementById('bold').onclick = () => window.format('bold');
    document.getElementById('italic').onclick = () => window.format('italic');
</script>
</body>
</html>
