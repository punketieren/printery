<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ProseMirror WYSIWYG + Markmap</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/markdown/markdown.min.js"></script>
</head>
<body>
<div class="container">
    <div class="editor-panel" id="editor-panel">
        <button class="collapse-btn" id="collapse-editor" title="Свернуть/развернуть">◀</button>
        <div class="panel-content">
            <div class="editor-toolbar">
                <span id="heading-level" style="margin:0 4px; font-size:13px;">-</span>
                <div class="heading-stack">
                    <button id="heading-up" title="Повысить уровень"><img src="img/heading-up.svg" alt="▲"></button>
                    <button id="heading-down" title="Понизить уровень"><img src="img/heading-down.svg" alt="▼"></button>
                </div>
                <button id="undo" title="Отменить (Ctrl+Z)"><img src="img/undo.svg" alt="↩️"></button>
                <button id="redo" title="Повторить (Ctrl+Y)"><img src="img/redo.svg" alt="↪️"></button>
                <button id="ul" title="Маркированный список"><img src="img/ul.svg" alt="•"></button>
                <button id="ol" title="Нумерованный список"><img src="img/ol.svg" alt="1."></button>
                <button id="quote" title="Цитата"><img src="img/quote.svg" alt='"'> </button>
                <button id="code-block" title="Блок кода"><img src="img/code-block.svg" alt="{ }"></button>
                <button id="strike" title="Зачёркнутый"><img src="img/strike.svg" alt="S"></button>
                <div class="dropdown">
                    <button><img src="img/menu-down.svg" alt="▼"></button>
                    <div class="dropdown-content">
                        <button id="bold"><img src="img/bold.svg" alt="B"></button>
                        <button id="italic"><img src="img/italic.svg" alt="I"></button>
                        <button id="code-inline"><img src="img/code-inline.svg" alt="<>"></button>
                        <button id="highlight"><img src="img/highlight.svg" alt="H"></button>
                    </div>
                </div>
                <div class="dropdown">
                    <button><img src="img/menu-dots.svg" alt="⋯"></button>
                    <div class="dropdown-content">
                        <button id="link"><img src="img/link.svg" alt="🔗"></button>
                        <button id="hr"><img src="img/hr.svg" alt="—"></button>
                        <button id="save-btn"><img src="img/save.svg" alt="💾"></button>
                        <button id="load-btn"><img src="img/load.svg" alt="📂"></button>
                    </div>
                </div>
            </div>
            <div id="editor" style="flex:1;"></div>
            <div class="editor-status-bar">
                <div class="mode-switch">
                    <label><input type="radio" name="editor-mode" value="wysiwyg" checked> WYSIWYG</label>
                    <label><input type="radio" name="editor-mode" value="markdown"> Markdown</label>
                </div>
                <div class="editor-inline-status" id="editor-inline-status">Редактор готов</div>
            </div>
        </div>
    </div>
    <div class="viewer-panel" id="viewer-panel">
        <div class="map-toolbar">
            <button id="fit-btn" title="Подогнать карту"><img src="img/fit.svg" alt=""></button>
            <button id="fullscreen-map" title="Полный экран"><img src="img/fullscreen.svg" alt=""></button>
            <button id="save-png" title="Сохранить как PNG"><img src="img/save-png.svg" alt=""></button>
            <button id="collapse-level2" title="Свернуть узлы уровня 2 и глубже"><img src="img/collapse.svg" alt=""></button>
            <button id="expand-all-map" title="Развернуть все узлы"><img src="img/expand.svg" alt=""></button>
        </div>
        <div id="markmap-container"></div>
    </div>
</div>
<div class="global-status" id="global-status">Готов</div>
 
<script src="bundle.js"></script>
<script>
    (function() {
        // --- Только консольный отладчик ---
        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const prefix = `[${time}]`;
            if (type === 'error') {
                console.error(`${prefix} ${msg}`);
            } else {
                console.log(`${prefix} ${msg}`);
            }
        }

        log('Скрипт инициализации запущен');

        // --- Проверка глобальных функций из bundle.js ---
        setTimeout(() => {
            log(`window.format: ${typeof window.format}`);
            log(`window.saveToFile: ${typeof window.saveToFile}`);
            log(`window.loadFromFile: ${typeof window.loadFromFile}`);
            log(`window.collapseLevel: ${typeof window.collapseLevel}`);
            log(`window.expandAll: ${typeof window.expandAll}`);
            log(`window.switchToWysiwyg: ${typeof window.switchToWysiwyg}`);
            log(`window.switchToMarkdown: ${typeof window.switchToMarkdown}`);
        }, 500);

        // --- Элементы DOM ---
        const panel = document.getElementById('editor-panel');
        const collapseBtn = document.getElementById('collapse-editor');
        const globalStatus = document.getElementById('global-status');
        const inlineStatus = document.getElementById('editor-inline-status');
        const wysiwygRadio = document.querySelector('input[value="wysiwyg"]');
        const markdownRadio = document.querySelector('input[value="markdown"]');
        const viewerPanel = document.getElementById('viewer-panel');
        const fitBtn = document.getElementById('fit-btn');
        const fullscreenBtn = document.getElementById('fullscreen-map');
        const savePngBtn = document.getElementById('save-png');
        const collapseLevel2Btn = document.getElementById('collapse-level2');
        const expandAllMapBtn = document.getElementById('expand-all-map');

        // --- Сворачивание панели редактора ---
        if (collapseBtn) {
            collapseBtn.addEventListener('click', () => {
                log('Сворачивание панели редактора');
                panel.classList.toggle('collapsed');
                collapseBtn.textContent = panel.classList.contains('collapsed') ? '▶' : '◀';
                setTimeout(() => {
                    if (window.currentMarkmap && window.currentMarkmap.fit) {
                        window.currentMarkmap.fit();
                        log('fit выполнен после сворачивания');
                    }
                }, 200);
            });
        }

        // --- Переключение режимов WYSIWYG / Markdown ---
        if (wysiwygRadio && markdownRadio) {
            wysiwygRadio.addEventListener('change', () => {
                if (wysiwygRadio.checked && window.switchToWysiwyg) {
                    window.switchToWysiwyg();
                    if (inlineStatus) inlineStatus.textContent = 'Режим WYSIWYG';
                    log('Переключено на WYSIWYG');
                } else if (wysiwygRadio.checked) {
                    log('window.switchToWysiwyg не определена', 'error');
                }
            });
            markdownRadio.addEventListener('change', () => {
                if (markdownRadio.checked && window.switchToMarkdown) {
                    window.switchToMarkdown();
                    if (inlineStatus) inlineStatus.textContent = 'Режим Markdown';
                    log('Переключено на Markdown');
                } else if (markdownRadio.checked) {
                    log('window.switchToMarkdown не определена', 'error');
                }
            });
        }

        // --- Кнопки управления картой ---
        function fitMap() {
            log('fitMap вызван');
            if (window.currentMarkmap && window.currentMarkmap.fit) {
                window.currentMarkmap.fit();
                if (globalStatus) globalStatus.textContent = '✅ Карта подогнана';
                log('fit выполнен');
            } else {
                log('currentMarkmap или fit не найден', 'error');
            }
        }
        function toggleFullscreen() {
            log('Переключение полноэкранного режима');
            viewerPanel.classList.toggle('fullscreen');
            const isFull = viewerPanel.classList.contains('fullscreen');
            if (fullscreenBtn) {
                fullscreenBtn.innerHTML = isFull ? '<img src="img/exit-fullscreen.svg" alt="">' : '<img src="img/fullscreen.svg" alt="">';
            }
            setTimeout(() => fitMap(), 100);
        }
        function saveAsPNG() {
            log('Сохранение PNG');
            const svg = document.querySelector('#markmap-container svg');
            if (!svg) {
                log('SVG не найден', 'error');
                if (globalStatus) globalStatus.textContent = '❌ Нет карты';
                return;
            }
            const clone = svg.cloneNode(true);
            const bbox = svg.getBBox();
            const width = bbox.width || 800;
            const height = bbox.height || 600;
            clone.setAttribute('width', width);
            clone.setAttribute('height', height);
            clone.setAttribute('viewBox', `${bbox.x} ${bbox.y} ${width} ${height}`);
            const serializer = new XMLSerializer();
            const svgStr = serializer.serializeToString(clone);
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0);
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = 'mindmap.png';
                a.click();
                log('PNG сохранён');
                if (globalStatus) globalStatus.textContent = '✅ Сохранено';
            };
            img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svgStr);
        }
        function collapseLevel(level) {
            log(`Сворачивание узлов до уровня ${level}`);
            if (window.collapseLevel) window.collapseLevel(level);
            else log('window.collapseLevel не определена', 'error');
        }
        function expandAll() {
            log('Разворачивание всех узлов');
            if (window.expandAll) window.expandAll();
            else log('window.expandAll не определена', 'error');
        }

        if (fitBtn) fitBtn.onclick = fitMap;
        if (fullscreenBtn) fullscreenBtn.onclick = toggleFullscreen;
        if (savePngBtn) savePngBtn.onclick = saveAsPNG;
        if (collapseLevel2Btn) collapseLevel2Btn.onclick = () => collapseLevel(2);
        if (expandAllMapBtn) expandAllMapBtn.onclick = expandAll;

        // --- Привязка кнопок редактора к глобальным функциям из bundle.js ---
        const bind = (id, method, arg = null) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.onclick = () => {
                log(`Клик по ${id}, вызов ${method}${arg !== null ? ' с аргументом ' + arg : ''}`);
                if (arg !== null && window[method]) window[method](arg);
                else if (window[method]) window[method]();
                else log(`window.${method} не определена`, 'error');
                if (method === 'saveToFile' && globalStatus) globalStatus.textContent = '✅ Сохранено';
                else if (method === 'loadFromFile' && globalStatus) globalStatus.textContent = '✅ Загружено';
                setTimeout(() => { if (globalStatus && globalStatus.textContent !== 'Готов') globalStatus.textContent = 'Готов'; }, 1500);
            };
        };

        bind('undo', 'undo');
        bind('redo', 'redo');
        bind('heading-up', 'changeHeading', 1);
        bind('heading-down', 'changeHeading', -1);
        bind('bold', 'format', 'bold');
        bind('italic', 'format', 'italic');
        bind('code-inline', 'format', 'code');
        bind('highlight', 'format', 'highlight');
        bind('ul', 'format', 'bullet_list');
        bind('ol', 'format', 'ordered_list');
        bind('quote', 'format', 'blockquote');
        bind('code-block', 'format', 'code_block');
        bind('strike', 'format', 'strike');
        bind('link', 'format', 'link');
        bind('hr', 'format', 'horizontal_rule');
        bind('save-btn', 'saveToFile');
        bind('load-btn', 'loadFromFile');

        // --- Обновление отображения уровня заголовка ---
        window.updateHeadingLevelDisplay = (level) => {
            const span = document.getElementById('heading-level');
            if (span) span.textContent = (level === 0) ? '-' : 'H' + level;
            log(`Уровень заголовка: ${span.textContent}`);
        };

        window.addEventListener('resize', () => {
            log('Resize окна, fitMap');
            fitMap();
        });

        log('Инициализация скрипта завершена');
    })();
</script>
</body>
</html>
