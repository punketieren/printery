<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WYSIWYG Markdown Editor with Markmap (стабильная версия)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f7fb; font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .toolbar { background: white; padding: 6px 12px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0; position: sticky; top: 0; z-index: 10; }
        .toolbar-group { display: flex; gap: 3px; align-items: center; background: #f8fafc; padding: 3px 6px; border-radius: 6px; }
        .toolbar button { background: white; border: 1px solid #cbd5e1; border-radius: 5px; cursor: pointer; font-size: 13px; min-width: 28px; padding: 4px 8px; }
        .toolbar button.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .toolbar select { background: white; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px; padding: 4px 6px; }
        .container { flex: 1; display: flex; gap: 10px; padding: 10px; overflow: hidden; }
        .editor-panel { flex: 1; display: flex; flex-direction: column; background: white; border-radius: 12px; overflow: hidden; }
        .viewer-panel { flex: 1; background: white; border-radius: 12px; overflow: hidden; position: relative; }
        #editor { height: 100%; overflow-y: auto; padding: 20px; outline: none; font-size: 16px; line-height: 1.5; }
        #editor h1 { font-size: 2em; margin: 0.5em 0; }
        #editor h2 { font-size: 1.5em; margin: 0.5em 0; }
        #editor h3 { font-size: 1.25em; margin: 0.5em 0; }
        #editor ul, #editor ol { padding-left: 2em; margin: 0.5em 0; }
        #editor blockquote { border-left: 4px solid #3b82f6; margin: 0.5em 0; padding-left: 1em; color: #555; }
        #editor code { background: #f1f5f9; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
        #editor pre { background: #f1f5f9; padding: 12px; border-radius: 8px; overflow-x: auto; }
        #editor mark { background: #fef08a; }
        #markmap-container { width: 100%; height: 100%; }
        .status-bar { background: white; border-top: 1px solid #e2e8f0; padding: 6px 12px; font-size: 12px; display: flex; justify-content: space-between; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/turndown@7.1.2/dist/turndown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.3/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.3/dist/index.min.js"></script>
</head>
<body>
<div class="toolbar">
    <div class="toolbar-group">
        <select id="heading-select"><option value="">Абзац</option><option value="H1">H1</option><option value="H2">H2</option><option value="H3">H3</option></select>
    </div>
    <div class="toolbar-group">
        <button id="bold"><b>B</b></button>
        <button id="italic"><i>I</i></button>
        <button id="strike"><s>S</s></button>
        <button id="code-inline">&lt;/&gt;</button>
        <button id="highlight"><mark>H</mark></button>
    </div>
    <div class="toolbar-group">
        <button id="ul">•</button>
        <button id="ol">1.</button>
        <button id="quote">"</button>
    </div>
    <div class="toolbar-group">
        <button id="link">🔗</button>
        <button id="image">🖼️</button>
        <button id="hr">—</button>
    </div>
    <div class="toolbar-group">
        <button id="save-btn">💾 Сохранить</button>
        <button id="load-btn">📂 Загрузить</button>
    </div>
</div>
<div class="container">
    <div class="editor-panel">
        <div id="editor" contenteditable="true"></div>
    </div>
    <div class="viewer-panel">
        <div id="markmap-container"></div>
    </div>
</div>
<div class="status-bar">
    <span>✏️ WYSIWYG Markdown + Markmap</span>
    <span id="status">Готов</span>
</div>

<script>
    const editor = document.getElementById('editor');
    const statusSpan = document.getElementById('status');
    let currentMarkdown = '';
    let turndownService = null;
    let markedLib = null;
    let markmapTransformer = null;
    let markmapView = null;
    let currentMarkmap = null;

    function initConverters() {
        if (typeof TurndownService !== 'undefined') {
            turndownService = new TurndownService({ headingStyle: 'atx', bulletListMarker: '-' });
            turndownService.addRule('highlight', { filter: 'mark', replacement: (c) => `==${c}==` });
        }
        if (typeof marked !== 'undefined') {
            markedLib = marked;
            markedLib.setOptions({ breaks: true, gfm: true });
        }
    }

    function htmlToMarkdown(html) {
        if (!turndownService) return html;
        return turndownService.turndown(html);
    }

    function markdownToHtml(md) {
        if (!markedLib) return md;
        return markedLib.parse(md);
    }

    function updateMarkmap() {
        if (!markmapTransformer || !markmapView || !currentMarkdown) return;
        const container = document.getElementById('markmap-container');
        if (!container) return;
        try {
            const transformer = new markmapTransformer();
            const { root } = transformer.transform(currentMarkdown || '# Пусто');
            while (container.firstChild) container.removeChild(container.firstChild);
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.style.width = '100%';
            svg.style.height = '100%';
            container.appendChild(svg);
            if (currentMarkmap) currentMarkmap.destroy?.();
            currentMarkmap = markmapView.create(svg, null, root);
        } catch(e) { console.warn(e); }
    }

    function format(command, value = null) {
        editor.focus();
        document.execCommand(command, false, value);
        updateFromEditor();
        updateButtonStates();
        statusSpan.innerText = `✅ ${command}`;
        setTimeout(() => statusSpan.innerText = 'Готов', 1000);
    }

    function wrapSelection(tag, placeholder) {
        editor.focus();
        const selection = window.getSelection();
        if (selection.isCollapsed) {
            document.execCommand('insertHTML', false, `<${tag}>${placeholder}</${tag}>`);
        } else {
            const range = selection.getRangeAt(0);
            const selected = range.toString();
            document.execCommand('insertHTML', false, `<${tag}>${selected}</${tag}>`);
        }
        updateFromEditor();
        statusSpan.innerText = `✅ ${tag}`;
        setTimeout(() => statusSpan.innerText = 'Готов', 1000);
    }

    function toggleQuote() {
        editor.focus();
        const selection = window.getSelection();
        if (selection.isCollapsed) return;
        const range = selection.getRangeAt(0);
        let container = range.commonAncestorContainer;
        if (container.nodeType === Node.TEXT_NODE) container = container.parentElement;
        const blockquote = container.closest('blockquote');
        if (blockquote) {
            const parent = blockquote.parentNode;
            while (blockquote.firstChild) parent.insertBefore(blockquote.firstChild, blockquote);
            parent.removeChild(blockquote);
        } else {
            document.execCommand('formatBlock', false, 'blockquote');
        }
        updateFromEditor();
    }

    function updateButtonStates() {
        document.getElementById('bold').classList.toggle('active', document.queryCommandState('bold'));
        document.getElementById('italic').classList.toggle('active', document.queryCommandState('italic'));
        document.getElementById('strike').classList.toggle('active', document.queryCommandState('strikeThrough'));
        document.getElementById('ul').classList.toggle('active', document.queryCommandState('insertUnorderedList'));
        document.getElementById('ol').classList.toggle('active', document.queryCommandState('insertOrderedList'));
    }

    function updateFromEditor() {
        const html = editor.innerHTML;
        const newMarkdown = htmlToMarkdown(html);
        if (newMarkdown === currentMarkdown) return;
        currentMarkdown = newMarkdown;
        updateMarkmap();
    }

    function saveToFile() {
        if (!currentMarkdown) return;
        const blob = new Blob([currentMarkdown], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'document.md';
        a.click();
        URL.revokeObjectURL(url);
        statusSpan.innerText = '✅ Сохранено';
        setTimeout(() => statusSpan.innerText = 'Готов', 1500);
    }

    function loadFromFile() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.md,.txt';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const md = ev.target.result;
                const html = markdownToHtml(md);
                editor.innerHTML = html;
                currentMarkdown = md;
                updateMarkmap();
                statusSpan.innerText = '✅ Загружено';
                setTimeout(() => statusSpan.innerText = 'Готов', 1500);
            };
            reader.readAsText(file);
        };
        input.click();
    }

    // Назначение кнопок
    document.getElementById('heading-select').onchange = (e) => {
        if (e.target.value) format('formatBlock', e.target.value);
        e.target.value = '';
    };
    document.getElementById('bold').onclick = () => format('bold');
    document.getElementById('italic').onclick = () => format('italic');
    document.getElementById('strike').onclick = () => format('strikeThrough');
    document.getElementById('code-inline').onclick = () => wrapSelection('code', 'код');
    document.getElementById('highlight').onclick = () => wrapSelection('mark', 'текст');
    document.getElementById('ul').onclick = () => format('insertUnorderedList');
    document.getElementById('ol').onclick = () => format('insertOrderedList');
    document.getElementById('quote').onclick = toggleQuote;
    document.getElementById('link').onclick = () => {
        let url = prompt('Введите URL:');
        if (url) format('createLink', url);
    };
    document.getElementById('image').onclick = () => {
        let url = prompt('Введите URL изображения:');
        if (url) format('insertImage', url);
    };
    document.getElementById('hr').onclick = () => format('insertHorizontalRule');
    document.getElementById('save-btn').onclick = saveToFile;
    document.getElementById('load-btn').onclick = loadFromFile;

    // Инициализация
    initConverters();
    setTimeout(() => {
        if (typeof markmap !== 'undefined') {
            markmapTransformer = markmap.Transformer;
            markmapView = markmap.Markmap;
            updateMarkmap();
        }
    }, 500);

    const defaultMarkdown = `# Центральная идея

## Основной раздел 1

### Деталь 1.1

### Деталь 1.2

**Жирный** и *курсив* и ~~зачёркнутый~~

- Список 1
- Список 2

1. Нумерованный
2. Второй

> Цитата

\`код\`

---
`;
    const initialHtml = markdownToHtml(defaultMarkdown);
    editor.innerHTML = initialHtml;
    currentMarkdown = defaultMarkdown;
    editor.addEventListener('input', updateFromEditor);
    editor.addEventListener('keyup', updateButtonStates);
    editor.addEventListener('mouseup', updateButtonStates);
    updateButtonStates();
    updateMarkmap();
    statusSpan.innerText = 'Готов';
</script>
</body>
</html>
