<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ProseMirror Editor</title>
    <style>
        body { display: flex; gap: 20px; padding: 20px; }
        #editor { flex: 1; border: 1px solid #ccc; min-height: 500px; }
        #markmap-container { flex: 1; border: 1px solid #ccc; min-height: 500px; }
        .toolbar { margin-bottom: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
        button { padding: 4px 8px; }
        select { padding: 4px; }
    </style>
</head>
<body>
<div style="width: 100%;">
    <div class="toolbar">
        <select id="heading-select">
            <option value="">-</option>
            <option value="h1">H1</option><option value="h2">H2</option><option value="h3">H3</option>
        </select>
        <button id="bold"><b>B</b></button>
        <button id="italic"><i>I</i></button>
        <button id="strike"><s>S</s></button>
        <button id="code-block">{ }</button>
        <button id="quote">"</button>
        <button id="ul">•</button>
        <button id="ol">1.</button>
        <button id="save-btn">💾</button>
        <button id="load-btn">📂</button>
    </div>
    <div style="display: flex; gap: 20px;">
        <div id="editor"></div>
        <div id="markmap-container"></div>
    </div>
</div>
<script src="bundle.js"></script>
<script>
    document.getElementById('bold').onclick = () => window.format('bold');
    document.getElementById('italic').onclick = () => window.format('italic');
    document.getElementById('strike').onclick = () => window.format('strike');
    document.getElementById('code-block').onclick = () => window.format('code_block');
    document.getElementById('quote').onclick = () => window.format('blockquote');
    document.getElementById('ul').onclick = () => window.format('bullet_list');
    document.getElementById('ol').onclick = () => window.format('ordered_list');
    document.getElementById('save-btn').onclick = () => window.saveToFile();
    document.getElementById('load-btn').onclick = () => window.loadFromFile();
    document.getElementById('heading-select').onchange = (e) => {
        const val = e.target.value;
        if (val === '') window.format('paragraph');
        else if (val === 'h1') window.format('heading', 1);
        else if (val === 'h2') window.format('heading', 2);
        else if (val === 'h3') window.format('heading', 3);
        e.target.value = '';
    };
</script>
</body>
</html>
