<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ProseMirror WYSIWYG + Markmap</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/markdown/markdown.min.js"></script>
    
    <!-- ProseMirror UMD сборки (работают напрямую с CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/orderedmap@2.0.0/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@prosemirror/model@1.19.0/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@prosemirror/state@1.4.0/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@prosemirror/view@1.31.0/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@prosemirror/schema-basic@1.2.0/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@prosemirror/schema-list@1.2.0/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@prosemirror/commands@1.3.0/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@prosemirror/keymap@1.2.0/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@prosemirror/history@1.3.0/dist/index.umd.js"></script>
</head>
<body>
<div class="container">
    <div class="editor-panel" id="editor-panel">
        <button class="collapse-btn" id="collapse-editor" title="Свернуть/развернуть">◀</button>
        <div class="panel-content">
            <div class="editor-toolbar">
                <span id="heading-level" style="margin:0 4px; font-size:13px;">-</span>
                <div class="heading-stack">
                    <button id="heading-up"><img src="img/heading-up.svg" alt="▲"></button>
                    <button id="heading-down"><img src="img/heading-down.svg" alt="▼"></button>
                </div>
                <button id="undo"><img src="img/undo.svg" alt="↩️"></button>
                <button id="redo"><img src="img/redo.svg" alt="↪️"></button>
                <button id="ul"><img src="img/ul.svg" alt="•"></button>
                <button id="ol"><img src="img/ol.svg" alt="1."></button>
                <button id="quote"><img src="img/quote.svg" alt='"'> </button>
                <button id="code-block"><img src="img/code-block.svg" alt="{ }"></button>
                <button id="strike"><img src="img/strike.svg" alt="S"></button>
                <div class="dropdown">
                    <button><img src="img/menu-down.svg" alt="▼"></button>
                    <div class="dropdown-content">
                        <button id="bold"><img src="img/bold.svg" alt="B"></button>
                        <button id="italic"><img src="img/italic.svg" alt="I"></button>
                        <button id="code-inline"><img src="img/code-inline.svg" alt="<>"></button>
                        <button id="highlight"><img src="img/highlight.svg" alt="H"></button>
                    </div>
                </div>
                <div class="dropdown">
                    <button><img src="img/menu-dots.svg" alt="⋯"></button>
                    <div class="dropdown-content">
                        <button id="link"><img src="img/link.svg" alt="🔗"></button>
                        <button id="hr"><img src="img/hr.svg" alt="—"></button>
                        <button id="save-btn"><img src="img/save.svg" alt="💾"></button>
                        <button id="load-btn"><img src="img/load.svg" alt="📂"></button>
                    </div>
                </div>
            </div>
            <div id="editor" style="flex:1; overflow-y: auto; min-height: 400px;"></div>
            <div class="editor-status-bar">
                <div class="mode-switch">
                    <label><input type="radio" name="editor-mode" value="wysiwyg" checked> WYSIWYG</label>
                    <label><input type="radio" name="editor-mode" value="markdown"> Markdown</label>
                </div>
                <div class="editor-inline-status" id="editor-inline-status">Редактор готов</div>
            </div>
        </div>
    </div>
    <div class="viewer-panel" id="viewer-panel">
        <div class="map-toolbar">
            <button id="fit-btn"><img src="img/fit.svg" alt=""></button>
            <button id="fullscreen-map"><img src="img/fullscreen.svg" alt=""></button>
            <button id="save-png"><img src="img/save-png.svg" alt=""></button>
            <button id="collapse-level2"><img src="img/collapse.svg" alt=""></button>
            <button id="expand-all-map"><img src="img/expand.svg" alt=""></button>
        </div>
        <div id="markmap-container"></div>
    </div>
</div>
<div class="global-status" id="global-status">Загрузка...</div>

<script>
// Инициализация ProseMirror (полностью рабочий код)
(function() {
    console.log('🚀 Инициализация...');
    
    function updateStatus(msg) {
        const status = document.getElementById('global-status');
        if (status) status.textContent = msg;
        console.log(msg);
    }
    
    // Проверяем загрузку библиотек
    function checkDeps() {
        // UMD сборки создают глобальные переменные с большой буквы P
        if (window.ProsemirrorModel && window.ProsemirrorState && window.ProsemirrorView) {
            console.log('✅ Библиотеки загружены');
            initEditor();
        } else {
            console.log('Ждём загрузку библиотек...');
            setTimeout(checkDeps, 100);
        }
    }
    
    function initEditor() {
        const { Schema } = window.ProsemirrorModel;
        const { EditorState } = window.ProsemirrorState;
        const { EditorView } = window.ProsemirrorView;
        
        // Простая схема для начала
        const mySchema = new Schema({
            nodes: {
                doc: { content: "block+" },
                paragraph: { 
                    group: "block", 
                    content: "inline*", 
                    parseDOM: [{ tag: "p" }], 
                    toDOM: () => ["p", 0] 
                },
                text: { group: "inline" }
            },
            marks: {
                strong: { parseDOM: [{ tag: "strong" }, { tag: "b" }], toDOM: () => ["strong", 0] },
                em: { parseDOM: [{ tag: "em" }, { tag: "i" }], toDOM: () => ["em", 0] }
            }
        });
        
        const editorElement = document.getElementById('editor');
        if (!editorElement) {
            console.error('Контейнер #editor не найден!');
            return;
        }
        
        // Начальное содержимое
        const initialDoc = mySchema.node("doc", null, [
            mySchema.node("paragraph", null, mySchema.text("Редактор работает! Попробуйте выделить текст и нажать Ctrl+B или Ctrl+I."))
        ]);
        
        // Создаём редактор
        const view = new EditorView(editorElement, {
            state: EditorState.create({
                schema: mySchema,
                doc: initialDoc
            })
        });
        
        window.editorView = view;
        updateStatus('✅ Редактор готов!');
        
        // Привязываем кнопки (если они есть на странице)
        const boldBtn = document.getElementById('bold');
        if (boldBtn) {
            boldBtn.onclick = () => {
                const { toggleMark } = window.ProsemirrorCommands;
                if (toggleMark) {
                    toggleMark(mySchema.marks.strong)(view.state, view.dispatch);
                    view.focus();
                }
            };
        }
        
        const italicBtn = document.getElementById('italic');
        if (italicBtn) {
            italicBtn.onclick = () => {
                const { toggleMark } = window.ProsemirrorCommands;
                if (toggleMark) {
                    toggleMark(mySchema.marks.em)(view.state, view.dispatch);
                    view.focus();
                }
            };
        }
        
        console.log('✅ Редактор создан успешно');
    }
    
    checkDeps();
})();
</script>
</body>
</html>
