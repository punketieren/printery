<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markmap — Редактор с панелью форматирования и полноэкранным режимом</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f7fb; height: 100vh; display: flex; flex-direction: column; font-family: system-ui, sans-serif; overflow: hidden; }
        
        /* Верхняя панель инструментов */
        .toolbar { background: white; padding: 8px 16px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; z-index: 10; }
        .toolbar button, .toolbar select { padding: 4px 10px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .toolbar button.primary { background: #3b82f6; border-color: #3b82f6; color: white; }
        .toolbar .separator { width: 1px; height: 24px; background: #cbd5e1; margin: 0 4px; }
        .toolbar .status { margin-left: auto; font-size: 12px; color: #475569; background: #f1f5f9; padding: 4px 12px; border-radius: 20px; }
        
        /* Основной контейнер */
        .main-container { flex: 1; display: flex; position: relative; overflow: hidden; }
        
        /* Выплывающая панель редактора */
        .editor-panel {
            position: absolute;
            left: 0;
            top: 0;
            width: 450px;
            height: 100%;
            background: white;
            border-right: 1px solid #e2e8f0;
            z-index: 20;
            transform: translateX(0);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
        }
        .editor-panel.collapsed { transform: translateX(-100%); }
        
        /* Кнопка открытия/закрытия редактора */
        .toggle-editor-btn {
            position: absolute;
            left: 460px;
            top: 20px;
            width: 32px;
            height: 32px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: left 0.3s ease;
            box-shadow: 2px 0 4px rgba(0,0,0,0.05);
        }
        .editor-panel.collapsed + .toggle-editor-btn { left: 10px; }
        
        .editor-header { 
            padding: 12px 16px; 
            border-bottom: 1px solid #e2e8f0; 
            font-weight: bold;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            background: #fafafa;
        }
        .editor-header button {
            padding: 4px 8px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .editor-header button:hover { background: #f1f5f9; transform: scale(1.02); }
        .editor-header .separator { width: 1px; height: 20px; background: #cbd5e1; margin: 0 4px; }
        
        .editor-panel textarea { width: 100%; flex: 1; font-family: monospace; font-size: 14px; padding: 16px; border: none; resize: none; outline: none; background: #fafafa; }
        
        /* Панель просмотра карты */
        .viewer-panel { flex: 1; background: white; overflow: hidden; position: relative; margin-left: 0; transition: margin-left 0.3s ease; }
        .viewer-panel.fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; margin: 0; border-radius: 0; background: white; }
        
        .viewer-panel .markmap { width: 100%; height: 100%; }
        
        .fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        .fullscreen-btn:hover { background: #f1f5f9; transform: scale(1.05); }
        
        .map-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            display: flex;
            gap: 5px;
            padding: 5px;
            z-index: 30;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .map-controls button {
            width: 32px;
            height: 32px;
            border: none;
            background: #f8fafc;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        .map-controls button:hover { background: #e2e8f0; }
        
        @media (max-width: 768px) { .editor-panel { width: 100%; } .toggle-editor-btn { left: calc(100% - 40px); top: 70px; } .editor-panel.collapsed + .toggle-editor-btn { left: 10px; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader"></script>
</head>
<body>
    <div class="toolbar">
        <!-- Файлы -->
        <button id="save-btn" title="Сохранить в файл">💾 Сохранить</button>
        <button id="load-btn" title="Загрузить из файла">📂 Загрузить</button>
        <span class="status" id="status-text">✨ Редактируйте Markdown</span>
    </div>
    
    <div class="main-container">
        <!-- Выплывающая панель редактора -->
        <div class="editor-panel" id="editor-panel">
            <div class="editor-header">
                <button id="btn-hash" title="Добавить заголовок (#)"># Заголовок</button>
                <div class="separator"></div>
                <button id="btn-bold" title="Жирный (Ctrl+B)"><b>B</b></button>
                <button id="btn-italic" title="Курсив (Ctrl+I)"><i>I</i></button>
                <div class="separator"></div>
                <button id="btn-ul" title="Маркированный список">• Список</button>
                <button id="btn-ol" title="Нумерованный список">1. Список</button>
                <div class="separator"></div>
                <button id="btn-link" title="Вставить ссылку">🔗 Ссылка</button>
            </div>
            <textarea id="markdown-editor"></textarea>
        </div>
        <!-- Кнопка открытия/закрытия редактора -->
        <button class="toggle-editor-btn" id="toggle-editor-btn" title="Скрыть/показать редактор">◀</button>
        
        <!-- Панель просмотра карты -->
        <div class="viewer-panel" id="viewer-panel">
            <div class="markmap" id="mindmap-container"></div>
            <button class="fullscreen-btn" id="fullscreen-btn" title="Полноэкранный режим">⛶</button>
            <div class="map-controls">
                <button id="collapse-all" title="Свернуть все ветки">−</button>
                <button id="expand-all" title="Развернуть всё">+</button>
            </div>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('markdown-editor');
        const container = document.getElementById('mindmap-container');
        const statusSpan = document.getElementById('status-text');
        const editorPanel = document.getElementById('editor-panel');
        const viewerPanel = document.getElementById('viewer-panel');
        const toggleBtn = document.getElementById('toggle-editor-btn');
        
        let isRendering = false;
        let renderTimeout = null;
        
        const defaultMarkdown = `# Центральная идея
## Основной раздел 1
### Деталь 1.1
### Деталь 1.2
#### Подробность 1.2.1
## Основной раздел 2
### Деталь 2.1
### Деталь 2.2
- Элемент списка 1
- Элемент списка 2`;
        
        // === ОБНОВЛЕНИЕ КАРТЫ с защитой от многократных вызовов ===
        function renderMindmap(markdownText) {
            if (isRendering) return;
            isRendering = true;
            
            try {
                container.innerHTML = markdownText;
                if (window.markmap?.autoLoader?.renderAll) {
                    window.markmap.autoLoader.renderAll();
                }
            } catch (e) {
                console.warn('Ошибка рендеринга:', e);
            } finally {
                setTimeout(() => { isRendering = false; }, 100);
            }
        }
        
        // Дебаунс для автоматического обновления
        function debouncedRender() {
            if (renderTimeout) clearTimeout(renderTimeout);
            renderTimeout = setTimeout(() => {
                renderMindmap(textarea.value);
            }, 300);
        }
        
        // === ВСТАВКА ТЕКСТА ===
        function insertPrefix(prefix) {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const lineStart = textarea.value.lastIndexOf('\n', start - 1) + 1;
            const newText = textarea.value.substring(0, lineStart) + prefix + textarea.value.substring(lineStart);
            textarea.value = newText;
            textarea.focus();
            const newCursorPos = lineStart + prefix.length + (end - start);
            textarea.setSelectionRange(newCursorPos, newCursorPos);
            renderMindmap(textarea.value);
        }
        
        function wrapSelection(before, after) {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            if (start === end) {
                const newText = textarea.value.substring(0, start) + before + after + textarea.value.substring(end);
                textarea.value = newText;
                textarea.focus();
                textarea.setSelectionRange(start + before.length, start + before.length);
            } else {
                const selected = textarea.value.substring(start, end);
                const newText = textarea.value.substring(0, start) + before + selected + after + textarea.value.substring(end);
                textarea.value = newText;
                textarea.focus();
                textarea.setSelectionRange(start + before.length, end + before.length);
            }
            renderMindmap(textarea.value);
        }
        
        // === ОБРАБОТЧИКИ КНОПОК ФОРМАТИРОВАНИЯ ===
        document.getElementById('btn-hash').onclick = () => insertPrefix('# ');
        document.getElementById('btn-bold').onclick = () => wrapSelection('**', '**');
        document.getElementById('btn-italic').onclick = () => wrapSelection('*', '*');
        document.getElementById('btn-ul').onclick = () => insertPrefix('- ');
        document.getElementById('btn-ol').onclick = () => insertPrefix('1. ');
        document.getElementById('btn-link').onclick = () => {
            const url = prompt('Введите URL:', 'https://');
            if (url) wrapSelection('[', `](${url})`);
        };
        
        // === УПРАВЛЕНИЕ ПАНЕЛЬЮ РЕДАКТОРА ===
        toggleBtn.onclick = () => {
            editorPanel.classList.toggle('collapsed');
            toggleBtn.textContent = editorPanel.classList.contains('collapsed') ? '▶' : '◀';
            // Принудительно обновляем карту после анимации
            setTimeout(() => {
                renderMindmap(textarea.value);
            }, 350);
        };
        
        // === ПОЛНОЭКРАННЫЙ РЕЖИМ ===
        document.getElementById('fullscreen-btn').onclick = () => {
            viewerPanel.classList.toggle('fullscreen');
            const btn = document.getElementById('fullscreen-btn');
            if (viewerPanel.classList.contains('fullscreen')) {
                btn.textContent = '✕';
                btn.title = 'Выйти из полноэкранного режима';
                // При входе в полноэкранный режим сворачиваем редактор
                if (!editorPanel.classList.contains('collapsed')) {
                    editorPanel.classList.add('collapsed');
                    toggleBtn.textContent = '▶';
                }
            } else {
                btn.textContent = '⛶';
                btn.title = 'Полноэкранный режим';
            }
            // Обновляем карту после изменения размера
            setTimeout(() => {
                renderMindmap(textarea.value);
            }, 100);
        };
        
        // === УПРАВЛЕНИЕ ВЕТКАМИ КАРТЫ ===
        function getMarkmapInstance() {
            const svg = document.querySelector('.markmap svg');
            if (svg && svg.__markmap__) {
                return svg.__markmap__;
            }
            return null;
        }
        
        function collapseAll() {
            const mm = getMarkmapInstance();
            if (mm && mm.state && mm.state.data) {
                function collapseNode(node) {
                    if (node.children) {
                        node.state = node.state || {};
                        node.state.collapsed = true;
                        node.children.forEach(collapseNode);
                    }
                }
                collapseNode(mm.state.data);
                mm.render();
            }
        }
        
        function expandAll() {
            const mm = getMarkmapInstance();
            if (mm && mm.state && mm.state.data) {
                function expandNode(node) {
                    if (node.children) {
                        node.state = node.state || {};
                        node.state.collapsed = false;
                        node.children.forEach(expandNode);
                    }
                }
                expandNode(mm.state.data);
                mm.render();
            }
        }
        
        document.getElementById('collapse-all').onclick = () => collapseAll();
        document.getElementById('expand-all').onclick = () => expandAll();
        
        // === СОХРАНЕНИЕ И ЗАГРУЗКА ===
        function saveToFile() {
            const blob = new Blob([textarea.value], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'mindmap.md';
            a.click();
            URL.revokeObjectURL(url);
            statusSpan.innerText = '✅ Сохранено';
            setTimeout(() => statusSpan.innerText = '✨ Редактируйте Markdown', 1500);
        }
        
        function loadFromFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.md,.txt';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    textarea.value = ev.target.result;
                    renderMindmap(ev.target.result);
                    statusSpan.innerText = '✅ Загружено';
                    setTimeout(() => statusSpan.innerText = '✨ Редактируйте Markdown', 1500);
                };
                reader.readAsText(file);
            };
            input.click();
        }
        
        // === ГОРЯЧИЕ КЛАВИШИ ===
        textarea.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch (e.key) {
                    case 'b': e.preventDefault(); document.getElementById('btn-bold').click(); break;
                    case 'i': e.preventDefault(); document.getElementById('btn-italic').click(); break;
                }
            }
        });
        
        // === АВТООБНОВЛЕНИЕ с дебаунсом ===
        textarea.addEventListener('input', debouncedRender);
        
        // === ИНИЦИАЛИЗАЦИЯ ===
        textarea.value = defaultMarkdown;
        // Небольшая задержка для инициализации autoloader
        setTimeout(() => {
            renderMindmap(defaultMarkdown);
        }, 200);
        document.getElementById('save-btn').onclick = saveToFile;
        document.getElementById('load-btn').onclick = loadFromFile;
        
        // Исправляем проблему с отображением при сворачивании/разворачивании
        window.addEventListener('resize', () => {
            setTimeout(() => {
                if (!editorPanel.classList.contains('collapsed') || viewerPanel.classList.contains('fullscreen')) {
                    renderMindmap(textarea.value);
                }
            }, 200);
        });
    </script>
</body>
</html>
