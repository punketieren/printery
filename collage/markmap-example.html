<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Markmap — Редактор ментальных карт (отладка)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f7fb;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        .toolbar {
            background: white;
            padding: 12px 24px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .toolbar button {
            padding: 6px 14px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .toolbar button.primary {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        .toolbar button.primary:hover {
            background: #2563eb;
        }
        .toolbar button:hover {
            background: #f1f5f9;
        }
        .toolbar .status {
            margin-left: auto;
            font-size: 13px;
            color: #475569;
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .main-container {
            flex: 1;
            display: flex;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }
        .editor-panel {
            width: 40%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 16px;
            overflow-y: auto;
        }
        .editor-panel textarea {
            width: 100%;
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: none;
            background: #fafafa;
        }
        .editor-panel .hint {
            font-size: 12px;
            color: #64748b;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }
        .viewer-panel {
            flex: 1;
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            position: relative;
        }
        svg {
            width: 100%;
            height: 100%;
        }
        .debug-panel {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: #1e1e1e;
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            padding: 8px 12px;
            border-radius: 8px;
            z-index: 999;
            max-width: 400px;
            max-height: 200px;
            overflow-y: auto;
            opacity: 0.9;
            pointer-events: none;
        }
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .editor-panel {
                width: 100%;
                height: 40%;
            }
            .debug-panel {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button id="apply-btn" class="primary">🔄 Применить</button>
        <button id="save-btn">💾 Сохранить (MD)</button>
        <button id="load-btn">📂 Загрузить (MD)</button>
        <button id="zoom-in">🔍 +</button>
        <button id="zoom-out">🔍 -</button>
        <button id="reset-view">⟳ Сброс</button>
        <span class="status" id="status-text">✨ Редактируйте Markdown → Нажмите «Применить»</span>
    </div>
    <div class="main-container">
        <div class="editor-panel">
            <textarea id="markdown-editor" placeholder="# Введите ваш Markdown здесь..."></textarea>
            <div class="hint">
                💡 Подсказка: # заголовок, ## подзаголовок, - элемент списка
            </div>
        </div>
        <div class="viewer-panel">
            <div id="mindmap-container" style="background: #fafafa; display: flex; align-items: center; justify-content: center; color: #999;">
                ⏳ Ожидание загрузки...
            </div>
        </div>
    </div>
    <div class="debug-panel" id="debug-panel">
        📋 Консоль отладки<br>
        Откройте консоль (F12) для деталей
    </div>

    <!-- Подключаем библиотеки как ES-модули -->
    <script type="importmap">
        {
            "imports": {
                "markmap-lib": "https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/index.js",
                "markmap-view": "https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/index.js",
                "d3": "https://cdn.jsdelivr.net/npm/d3@6.7.0/dist/d3.min.js",
                "katex": "https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"
            }
        }
    </script>
    <script type="module">
        // ============================================
        // ОТЛАДОЧНАЯ ФУНКЦИЯ
        // ============================================
        const debugLog = (step, data = null) => {
            const timestamp = new Date().toLocaleTimeString();
            const message = `[${timestamp}] ${step}`;
            console.log(`%c${message}`, 'color: #0f0; font-weight: bold;');
            if (data !== null) {
                console.log('  └─ Данные:', data);
            }
            // Обновляем панель отладки на странице
            const debugPanel = document.getElementById('debug-panel');
            if (debugPanel) {
                const newLine = document.createElement('div');
                newLine.textContent = message.substring(0, 60);
                debugPanel.appendChild(newLine);
                if (debugPanel.children.length > 10) {
                    debugPanel.removeChild(debugPanel.children[0]);
                }
            }
        };

        debugLog('🚀 Начало загрузки модулей...');

        try {
            debugLog('📦 Импорт модулей...');
            const { Transformer } = await import('markmap-lib');
            debugLog('✅ Transformer импортирован', typeof Transformer);
            
            const { Markmap } = await import('markmap-view');
            debugLog('✅ Markmap импортирован', typeof Markmap);
            
            const d3 = await import('d3');
            debugLog('✅ d3 импортирован', !!d3);
            
            debugLog('🎉 Все модули успешно загружены!');
            
            // === ДАННЫЕ ===
            const defaultMarkdown = `# Центральная идея
## Основной раздел 1
### Деталь 1.1
### Деталь 1.2
#### Подробность 1.2.1
#### Подробность 1.2.2
## Основной раздел 2
### Деталь 2.1
### Деталь 2.2
- Элемент списка 1
- Элемент списка 2`;

            debugLog('📝 Подготовка данных', { markdownLength: defaultMarkdown.length });

            // === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===
            let currentMarkmap = null;
            let currentSvg = null;
            const textarea = document.getElementById('markdown-editor');
            const container = document.getElementById('mindmap-container');
            const statusSpan = document.getElementById('status-text');
            
            debugLog('🔍 Поиск DOM элементов', { 
                textarea: !!textarea, 
                container: !!container,
                statusSpan: !!statusSpan
            });

            if (!textarea || !container) {
                throw new Error('Не найдены необходимые DOM элементы');
            }

            // === ФУНКЦИЯ РЕНДЕРИНГА ===
            window.renderMindmap = function(markdownText, step = 'manual') {
                debugLog(`🖌️ renderMindmap вызван (${step})`, { markdownLength: markdownText?.length });
                
                try {
                    // Проверка входных данных
                    if (!markdownText || typeof markdownText !== 'string') {
                        throw new Error(`Неверный тип markdownText: ${typeof markdownText}`);
                    }
                    
                    debugLog('🔄 Преобразование Markdown в данные...');
                    const transformer = new Transformer();
                    const { root } = transformer.transform(markdownText);
                    debugLog('✅ Преобразование выполнено', { 
                        hasRoot: !!root, 
                        rootKeys: root ? Object.keys(root) : [],
                        rootContent: root?.data?.content?.substring(0, 50)
                    });
                    
                    // Очищаем контейнер
                    debugLog('🧹 Очистка контейнера...');
                    while (container.firstChild) {
                        container.removeChild(container.firstChild);
                    }
                    
                    // Создаём SVG элемент
                    debugLog('🎨 Создание SVG элемента...');
                    currentSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    currentSvg.style.width = "100%";
                    currentSvg.style.height = "100%";
                    currentSvg.setAttribute('viewBox', '0 0 1000 600');
                    container.appendChild(currentSvg);
                    debugLog('✅ SVG создан', { svg: !!currentSvg });
                    
                    // Создаём карту
                    debugLog('🗺️ Создание карты Markmap...');
                    currentMarkmap = Markmap.create(currentSvg, {
                        autoFit: true,
                        duration: 500,
                        initialExpandLevel: 2,
                        color: (node) => {
                            const level = node.depth || 0;
                            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
                            return colors[level % colors.length];
                        }
                    }, root);
                    
                    debugLog('✅ Карта успешно создана!', { 
                        hasMarkmap: !!currentMarkmap,
                        svgChildren: currentSvg.children.length
                    });
                    
                    statusSpan.innerHTML = '✅ Карта обновлена';
                    setTimeout(() => {
                        if (statusSpan.innerHTML === '✅ Карта обновлена') {
                            statusSpan.innerHTML = '✨ Редактируйте Markdown → Нажмите «Применить»';
                        }
                    }, 2000);
                    
                } catch (error) {
                    console.error('❌ Ошибка рендеринга:', error);
                    debugLog(`❌ Ошибка: ${error.message}`, error.stack);
                    statusSpan.innerHTML = `❌ Ошибка: ${error.message}`;
                    container.innerHTML = `<div style="padding: 20px; color: red; text-align: center;">❌ Ошибка: ${error.message}<br><br>Подробности в консоли (F12)</div>`;
                }
            };

            // === ПРИМЕНИТЬ ИЗМЕНЕНИЯ ===
            window.applyChanges = function() {
                debugLog('🔘 Нажата кнопка "Применить"');
                const newMarkdown = textarea.value;
                debugLog('📝 Текст из редактора', { length: newMarkdown.length, preview: newMarkdown.substring(0, 100) });
                window.renderMindmap(newMarkdown, 'apply');
            };

            // === СОХРАНЕНИЕ В ФАЙЛ ===
            window.saveToFile = function() {
                debugLog('🔘 Нажата кнопка "Сохранить"');
                const content = textarea.value;
                const blob = new Blob([content], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `mindmap_${new Date().toISOString().slice(0,19)}.md`;
                a.click();
                URL.revokeObjectURL(url);
                debugLog('✅ Файл сохранён', { size: blob.size });
                statusSpan.innerHTML = '✅ Файл сохранён';
                setTimeout(() => {
                    statusSpan.innerHTML = '✨ Редактируйте Markdown → Нажмите «Применить»';
                }, 1500);
            };

            // === ЗАГРУЗКА ИЗ ФАЙЛА ===
            window.loadFromFile = function() {
                debugLog('🔘 Нажата кнопка "Загрузить"');
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.md,.txt';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    debugLog('📁 Выбран файл', { name: file.name, size: file.size });
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const content = ev.target.result;
                        debugLog('📖 Файл прочитан', { length: content.length });
                        textarea.value = content;
                        window.renderMindmap(content, 'load');
                        statusSpan.innerHTML = '✅ Файл загружен';
                        setTimeout(() => {
                            statusSpan.innerHTML = '✨ Редактируйте Markdown → Нажмите «Применить»';
                        }, 1500);
                    };
                    reader.onerror = (err) => {
                        debugLog('❌ Ошибка чтения файла', err);
                        statusSpan.innerHTML = '❌ Ошибка чтения файла';
                    };
                    reader.readAsText(file);
                };
                input.click();
            };

            // === УПРАВЛЕНИЕ МАСШТАБОМ ===
            let currentScale = 1;
            window.zoomIn = function() {
                debugLog('🔘 Нажата кнопка "Zoom +"', { currentScale });
                if (currentSvg) {
                    currentScale *= 1.2;
                    currentSvg.style.transform = `scale(${currentScale})`;
                    currentSvg.style.transformOrigin = '0 0';
                    debugLog('✅ Масштаб увеличен', { newScale: currentScale });
                } else {
                    debugLog('⚠️ SVG не найден для масштабирования');
                }
            };
            
            window.zoomOut = function() {
                debugLog('🔘 Нажата кнопка "Zoom -"', { currentScale });
                if (currentSvg) {
                    currentScale /= 1.2;
                    currentSvg.style.transform = `scale(${currentScale})`;
                    currentSvg.style.transformOrigin = '0 0';
                    debugLog('✅ Масштаб уменьшен', { newScale: currentScale });
                } else {
                    debugLog('⚠️ SVG не найден для масштабирования');
                }
            };
            
            window.resetView = function() {
                debugLog('🔘 Нажата кнопка "Сброс"');
                if (currentSvg) {
                    currentScale = 1;
                    currentSvg.style.transform = 'scale(1)';
                    currentSvg.style.transformOrigin = '0 0';
                    debugLog('✅ Масштаб сброшен');
                    if (currentMarkmap && currentMarkmap.fit) {
                        currentMarkmap.fit();
                        debugLog('✅ Выполнен fit карты');
                    }
                } else {
                    debugLog('⚠️ SVG не найден для сброса');
                }
            };

            // === ИНИЦИАЛИЗАЦИЯ ===
            debugLog('🔧 Инициализация редактора...');
            textarea.value = defaultMarkdown;
            debugLog('📝 Текстовая область заполнена', { length: defaultMarkdown.length });
            
            // Подключаем обработчики кнопок
            const applyBtn = document.getElementById('apply-btn');
            const saveBtn = document.getElementById('save-btn');
            const loadBtn = document.getElementById('load-btn');
            const zoomInBtn = document.getElementById('zoom-in');
            const zoomOutBtn = document.getElementById('zoom-out');
            const resetBtn = document.getElementById('reset-view');
            
            debugLog('🔍 Поиск кнопок', {
                applyBtn: !!applyBtn,
                saveBtn: !!saveBtn,
                loadBtn: !!loadBtn,
                zoomInBtn: !!zoomInBtn,
                zoomOutBtn: !!zoomOutBtn,
                resetBtn: !!resetBtn
            });
            
            if (applyBtn) applyBtn.addEventListener('click', window.applyChanges);
            if (saveBtn) saveBtn.addEventListener('click', window.saveToFile);
            if (loadBtn) loadBtn.addEventListener('click', window.loadFromFile);
            if (zoomInBtn) zoomInBtn.addEventListener('click', window.zoomIn);
            if (zoomOutBtn) zoomOutBtn.addEventListener('click', window.zoomOut);
            if (resetBtn) resetBtn.addEventListener('click', window.resetView);
            
            debugLog('✅ Обработчики кнопок подключены');
            
            // Запускаем рендеринг после загрузки страницы
            window.addEventListener('load', () => {
                debugLog('🌐 Событие "load" окна');
                setTimeout(() => {
                    debugLog('⏱️ Задержка 100ms, запуск рендеринга...');
                    window.renderMindmap(defaultMarkdown, 'init');
                }, 100);
            });
            
            // Адаптация при изменении размера окна
            window.addEventListener('resize', () => {
                debugLog('📏 Изменение размера окна');
                setTimeout(() => {
                    if (currentMarkmap && currentMarkmap.fit) {
                        currentMarkmap.fit();
                        debugLog('✅ Выполнен fit при resize');
                    }
                }, 200);
            });
            
            // Если страница уже загружена (не сработал load)
            if (document.readyState === 'complete') {
                debugLog('⚠️ Страница уже загружена, запускаем рендеринг немедленно');
                setTimeout(() => {
                    window.renderMindmap(defaultMarkdown, 'init-immediate');
                }, 50);
            }
            
            debugLog('🎬 Инициализация завершена, ожидание событий...');
            
        } catch (error) {
            console.error('❌ КРИТИЧЕСКАЯ ОШИБКА:', error);
            debugLog(`❌ КРИТИЧЕСКАЯ ОШИБКА: ${error.message}`, error.stack);
            const container = document.getElementById('mindmap-container');
            if (container) {
                container.innerHTML = `<div style="padding: 20px; color: red; background: #ffe0e0; border-radius: 8px;">
                    <h3>❌ Критическая ошибка загрузки модулей</h3>
                    <p>${error.message}</p>
                    <p>Подробности в консоли браузера (F12)</p>
                    <p>Возможные причины: блокировка CDN, проблемы с сетью, неподдерживаемый браузер.</p>
                </div>`;
            }
            const statusSpan = document.getElementById('status-text');
            if (statusSpan) {
                statusSpan.innerHTML = '❌ Ошибка загрузки библиотек';
            }
        }
    </script>
</body>
</html>
