<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Markmap - Интерактивная ментальная карта</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fb;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Верхняя панель инструментов */
        .toolbar {
            background: white;
            padding: 12px 24px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            z-index: 10;
            flex-shrink: 0;
        }

        .toolbar button {
            padding: 6px 14px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .toolbar button.primary {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }

        .toolbar button.primary:hover {
            background: #2563eb;
        }

        .toolbar button:hover {
            background: #f1f5f9;
        }

        .toolbar .status {
            margin-left: auto;
            font-size: 13px;
            color: #475569;
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* Основной контейнер с редактором и картой */
        .main-container {
            flex: 1;
            display: flex;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }

        /* Панель редактора Markdown */
        .editor-panel {
            width: 40%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 16px;
            overflow-y: auto;
        }

        .editor-panel textarea {
            width: 100%;
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: none;
            background: #fafafa;
        }

        .editor-panel .hint {
            font-size: 12px;
            color: #64748b;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }

        /* Панель для отображения карты */
        .viewer-panel {
            flex: 1;
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            position: relative;
        }

        /* Стили для самой карты */
        .markmap-container {
            width: 100%;
            height: 100%;
        }
        
        svg.markmap {
            width: 100%;
            height: 100%;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .editor-panel {
                width: 100%;
                height: 40%;
            }
        }
    </style>
    <!-- Подключаем markmap-autoloader — официальный, самый простой способ интеграции -->
    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.18"></script>
</head>
<body>
    <div class="toolbar">
        <button id="apply-btn" class="primary">🔄 Применить изменения</button>
        <button id="save-btn">💾 Сохранить (MD)</button>
        <button id="load-btn">📂 Загрузить (MD)</button>
        <button id="zoom-in">🔍 Zoom +</button>
        <button id="zoom-out">🔍 Zoom -</button>
        <button id="reset-view">⟳ Сброс</button>
        <span class="status" id="status-text">✨ Готово. Редактируйте Markdown → Нажмите «Применить»</span>
    </div>
    <div class="main-container">
        <!-- Панель редактирования Markdown -->
        <div class="editor-panel">
            <textarea id="markdown-editor" rows="20" placeholder="# Введите ваш Markdown здесь..."></textarea>
            <div class="hint">
                💡 Подсказка: Используйте # для заголовков, ## для подзаголовков, - для списков.
            </div>
        </div>
        <!-- Панель отображения карты -->
        <div class="viewer-panel">
            <div class="markmap-container">
<script type="text/template" id="markmap-template">
markmap:
  maxWidth: 300
  colorFreezeLevel: 2

# Центральная идея
## Основной раздел 1
### Деталь 1.1
### Деталь 1.2
#### Подробность 1.2.1
#### Подробность 1.2.2
## Основной раздел 2
### Деталь 2.1
### Деталь 2.2
- Элемент списка 1
- Элемент списка 2
</script>
            </div>
        </div>
    </div>

    <script>
        // Получаем элементы DOM
        const textarea = document.getElementById('markdown-editor');
        const applyBtn = document.getElementById('apply-btn');
        const saveBtn = document.getElementById('save-btn');
        const loadBtn = document.getElementById('load-btn');
        const zoomInBtn = document.getElementById('zoom-in');
        const zoomOutBtn = document.getElementById('zoom-out');
        const resetBtn = document.getElementById('reset-view');
        const statusSpan = document.getElementById('status-text');

        // Получаем содержимое шаблона для инициализации
        const initialMarkdown = document.getElementById('markmap-template').innerHTML.trim();
        textarea.value = initialMarkdown;

        // Функция для обновления карты
        function updateMarkmap(markdownContent) {
            try {
                // Находим элемент, содержащий скрипт с шаблоном
                const scriptElement = document.querySelector('.markmap-container script[type="text/template"]');
                if (scriptElement) {
                    // Обновляем содержимое шаблона
                    scriptElement.innerHTML = markdownContent;
                } else {
                    // Если скрипта нет, создаём его заново
                    const container = document.querySelector('.markmap-container');
                    const newScript = document.createElement('script');
                    newScript.type = 'text/template';
                    newScript.innerHTML = markdownContent;
                    container.innerHTML = '';
                    container.appendChild(newScript);
                }
                
                // Перезапускаем markmap-autoloader для применения изменений
                if (window.markmap && window.markmap.autoloader) {
                    window.markmap.autoloader.load();
                } else {
                    // На случай, если autoloader ещё не инициализирован, ждём
                    setTimeout(() => {
                        if (window.markmap && window.markmap.autoloader) {
                            window.markmap.autoloader.load();
                        }
                    }, 100);
                }
                statusSpan.innerHTML = '✅ Карта обновлена';
                setTimeout(() => {
                    statusSpan.innerHTML = '✨ Готово. Редактируйте Markdown → Нажмите «Применить»';
                }, 2000);
            } catch (error) {
                console.error('Ошибка обновления карты:', error);
                statusSpan.innerHTML = '❌ Ошибка обновления карты';
            }
        }

        // Применить изменения из текстового поля
        applyBtn.onclick = () => {
            updateMarkmap(textarea.value);
        };

        // Сохранить в файл .md
        saveBtn.onclick = () => {
            const blob = new Blob([textarea.value], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'mindmap.md';
            a.click();
            URL.revokeObjectURL(url);
            statusSpan.innerHTML = '✅ Файл сохранён';
            setTimeout(() => {
                statusSpan.innerHTML = '✨ Готово. Редактируйте Markdown → Нажмите «Применить»';
            }, 1500);
        };

        // Загрузить из файла .md
        loadBtn.onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.md,.txt';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    textarea.value = ev.target.result;
                    updateMarkmap(ev.target.result);
                };
                reader.readAsText(file);
            };
            input.click();
        };

        // Управление масштабированием (ищем SVG карты)
        function getMarkmapSvg() {
            return document.querySelector('svg.markmap');
        }

        let currentScale = 1;
        zoomInBtn.onclick = () => {
            const svg = getMarkmapSvg();
            if (svg) {
                currentScale *= 1.2;
                svg.style.transform = `scale(${currentScale})`;
                svg.style.transformOrigin = '0 0';
            }
        };
        zoomOutBtn.onclick = () => {
            const svg = getMarkmapSvg();
            if (svg) {
                currentScale /= 1.2;
                svg.style.transform = `scale(${currentScale})`;
                svg.style.transformOrigin = '0 0';
            }
        };
        resetBtn.onclick = () => {
            const svg = getMarkmapSvg();
            if (svg) {
                currentScale = 1;
                svg.style.transform = 'scale(1)';
                // Дополнительный сброс позиции
                svg.style.transformOrigin = '0 0';
            }
        };

        // Инициализация: загружаем карту при старте
        setTimeout(() => {
            updateMarkmap(textarea.value);
        }, 100);

        // Обработка изменения размера окна
        window.addEventListener('resize', () => {
            setTimeout(() => {
                if (window.markmap && window.markmap.autoloader) {
                    window.markmap.autoloader.load();
                }
            }, 200);
        });
    </script>
</body>
</html>
