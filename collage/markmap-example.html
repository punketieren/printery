<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Markmap — Редактор ментальных карт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f7fb;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        .toolbar {
            background: white;
            padding: 12px 24px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .toolbar button {
            padding: 6px 14px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .toolbar button.primary {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        .toolbar button.primary:hover {
            background: #2563eb;
        }
        .toolbar button:hover {
            background: #f1f5f9;
        }
        .toolbar .status {
            margin-left: auto;
            font-size: 13px;
            color: #475569;
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .main-container {
            flex: 1;
            display: flex;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }
        .editor-panel {
            width: 40%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 16px;
            overflow-y: auto;
        }
        .editor-panel textarea {
            width: 100%;
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: none;
            background: #fafafa;
        }
        .editor-panel .hint {
            font-size: 12px;
            color: #64748b;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }
        .viewer-panel {
            flex: 1;
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            position: relative;
        }
        svg {
            width: 100%;
            height: 100%;
        }
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .editor-panel {
                width: 100%;
                height: 40%;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/d3@6.7.0/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/index.min.js"></script>
</head>
<body>
    <div class="toolbar">
        <button id="apply-btn" class="primary">🔄 Применить</button>
        <button id="save-btn">💾 Сохранить (MD)</button>
        <button id="load-btn">📂 Загрузить (MD)</button>
        <button id="zoom-in">🔍 +</button>
        <button id="zoom-out">🔍 -</button>
        <button id="reset-view">⟳ Сброс</button>
        <span class="status" id="status-text">✨ Редактируйте Markdown → Нажмите «Применить»</span>
    </div>
    <div class="main-container">
        <div class="editor-panel">
            <textarea id="markdown-editor" placeholder="# Введите ваш Markdown здесь..."></textarea>
            <div class="hint">
                💡 Подсказка: # заголовок, ## подзаголовок, - элемент списка
            </div>
        </div>
        <div class="viewer-panel">
            <div id="mindmap-container"></div>
        </div>
    </div>

    <script>
        (function() {
            // === 1. ДАННЫЕ ===
            const defaultMarkdown = `# Центральная идея
## Основной раздел 1
### Деталь 1.1
### Деталь 1.2
#### Подробность 1.2.1
#### Подробность 1.2.2
## Основной раздел 2
### Деталь 2.1
### Деталь 2.2
- Элемент списка 1
- Элемент списка 2`;

            // === 2. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===
            let currentMarkmap = null;
            let currentSvg = null;
            const textarea = document.getElementById('markdown-editor');
            const statusSpan = document.getElementById('status-text');

            // === 3. ФУНКЦИЯ РЕНДЕРИНГА ===
            function renderMindmap(markdownText) {
                try {
                    // Проверка загрузки библиотек
                    if (typeof window.markmap === 'undefined' || 
                        typeof window.markmap.Transformer === 'undefined' ||
                        typeof window.markmap.Markmap === 'undefined') {
                        statusSpan.innerHTML = '❌ Ошибка: библиотеки не загружены';
                        return;
                    }
                    
                    const Transformer = window.markmap.Transformer;
                    const Markmap = window.markmap.Markmap;
                    
                    // Преобразуем Markdown в данные
                    const transformer = new Transformer();
                    const { root } = transformer.transform(markdownText);
                    
                    // Получаем контейнер
                    const container = document.getElementById('mindmap-container');
                    if (!container) return;
                    
                    // Очищаем контейнер
                    while (container.firstChild) {
                        container.removeChild(container.firstChild);
                    }
                    
                    // Создаём SVG элемент
                    currentSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    currentSvg.style.width = "100%";
                    currentSvg.style.height = "100%";
                    container.appendChild(currentSvg);
                    
                    // Создаём карту
                    currentMarkmap = Markmap.create(currentSvg, {
                        autoFit: true,
                        duration: 500,
                        initialExpandLevel: 2,
                        color: (node) => {
                            const level = node.depth || 0;
                            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
                            return colors[level % colors.length];
                        }
                    }, root);
                    
                    statusSpan.innerHTML = '✅ Карта обновлена';
                    setTimeout(() => {
                        if (statusSpan.innerHTML === '✅ Карта обновлена') {
                            statusSpan.innerHTML = '✨ Редактируйте Markdown → Нажмите «Применить»';
                        }
                    }, 2000);
                    
                } catch (error) {
                    console.error('Ошибка рендеринга:', error);
                    statusSpan.innerHTML = '❌ Ошибка: ' + error.message;
                }
            }

            // === 4. ПРИМЕНИТЬ ИЗМЕНЕНИЯ ===
            function applyChanges() {
                const newMarkdown = textarea.value;
                renderMindmap(newMarkdown);
            }

            // === 5. СОХРАНЕНИЕ В ФАЙЛ ===
            function saveToFile() {
                const content = textarea.value;
                const blob = new Blob([content], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'mindmap.md';
                a.click();
                URL.revokeObjectURL(url);
                statusSpan.innerHTML = '✅ Файл сохранён';
                setTimeout(() => {
                    statusSpan.innerHTML = '✨ Редактируйте Markdown → Нажмите «Применить»';
                }, 1500);
            }

            // === 6. ЗАГРУЗКА ИЗ ФАЙЛА ===
            function loadFromFile() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.md,.txt';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        textarea.value = ev.target.result;
                        renderMindmap(ev.target.result);
                        statusSpan.innerHTML = '✅ Файл загружен';
                        setTimeout(() => {
                            statusSpan.innerHTML = '✨ Редактируйте Markdown → Нажмите «Применить»';
                        }, 1500);
                    };
                    reader.readAsText(file);
                };
                input.click();
            }

            // === 7. УПРАВЛЕНИЕ МАСШТАБОМ ===
            let currentScale = 1;
            function zoomIn() {
                if (currentSvg) {
                    currentScale *= 1.2;
                    currentSvg.style.transform = `scale(${currentScale})`;
                    currentSvg.style.transformOrigin = '0 0';
                }
            }
            function zoomOut() {
                if (currentSvg) {
                    currentScale /= 1.2;
                    currentSvg.style.transform = `scale(${currentScale})`;
                    currentSvg.style.transformOrigin = '0 0';
                }
            }
            function resetView() {
                if (currentSvg) {
                    currentScale = 1;
                    currentSvg.style.transform = 'scale(1)';
                    currentSvg.style.transformOrigin = '0 0';
                    if (currentMarkmap && currentMarkmap.fit) {
                        currentMarkmap.fit();
                    }
                }
            }

            // === 8. ИНИЦИАЛИЗАЦИЯ ===
            textarea.value = defaultMarkdown;
            
            window.addEventListener('load', () => {
                setTimeout(() => {
                    renderMindmap(defaultMarkdown);
                }, 100);
            });
            
            // Подключаем обработчики кнопок
            document.getElementById('apply-btn').addEventListener('click', applyChanges);
            document.getElementById('save-btn').addEventListener('click', saveToFile);
            document.getElementById('load-btn').addEventListener('click', loadFromFile);
            document.getElementById('zoom-in').addEventListener('click', zoomIn);
            document.getElementById('zoom-out').addEventListener('click', zoomOut);
            document.getElementById('reset-view').addEventListener('click', resetView);
            
            // Адаптация при изменении размера окна
            window.addEventListener('resize', () => {
                setTimeout(() => {
                    if (currentMarkmap && currentMarkmap.fit) {
                        currentMarkmap.fit();
                    }
                }, 200);
            });
        })();
    </script>
</body>
</html>
