<!DOCTYPE html>
<html>
<body>
    <style>
        .markmap > svg { width: 100%; height: 300px; }
    </style>
    
    <!-- Кнопка для обновления -->
    <button onclick="updateMindmap()">🔄 Обновить карту</button>
    
    <!-- Контейнер, который будет содержать карту -->
    <div class="markmap" id="mindmap-container">
# Стартовая идея
## Раздел 1
### Деталь 1.1
### Деталь 1.2
    </div>
    
    <script>
        function updateMindmap() {
            // Получаем контейнер
            const container = document.getElementById('mindmap-container');
            // Задаём новое содержимое в формате Markdown
            container.innerHTML = `
# Обновлённая идея
## Новый раздел
### Новая деталь 1
### Новая деталь 2
            `;
            // markmap-autoloader сам подхватит изменения и отрендерит карту
            if (window.markmap?.autoLoader?.renderAll) {
                window.markmap.autoLoader.renderAll();
            }
        }
    </script>
    
    <!-- Подключаем autoloader — основной механизм, который превращает Markdown в карту -->
    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader"></script>
</body>
</html>
