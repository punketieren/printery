<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WYSIWYG + Markmap — Редактор с ментальной картой</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f7fb; height: 100vh; display: flex; flex-direction: column; font-family: system-ui, sans-serif; overflow: hidden; }
        
        .toolbar { background: white; padding: 8px 16px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; z-index: 10; }
        .toolbar button { padding: 4px 10px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .toolbar button.primary { background: #3b82f6; border-color: #3b82f6; color: white; }
        .toolbar .separator { width: 1px; height: 24px; background: #cbd5e1; margin: 0 4px; }
        .toolbar .status { margin-left: auto; font-size: 12px; color: #475569; background: #f1f5f9; padding: 4px 12px; border-radius: 20px; }
        
        .main-container { flex: 1; display: flex; position: relative; overflow: hidden; }
        
        /* Панель редактора */
        .editor-panel {
            position: absolute;
            left: 0;
            top: 0;
            width: 450px;
            height: 100%;
            background: white;
            border-right: 1px solid #e2e8f0;
            z-index: 20;
            transform: translateX(0);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
        }
        .editor-panel.collapsed { transform: translateX(-100%); }
        
        .toggle-editor-btn {
            position: absolute;
            left: 460px;
            top: 20px;
            width: 32px;
            height: 32px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: left 0.3s ease;
            box-shadow: 2px 0 4px rgba(0,0,0,0.05);
        }
        .editor-panel.collapsed + .toggle-editor-btn { left: 10px; }
        
        /* Стили для WYSIWYG редактора (TipTap) */
        .editor-header { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; background: #fafafa; display: flex; gap: 8px; flex-wrap: wrap; }
        .editor-header button { padding: 4px 8px; background: white; border: 1px solid #cbd5e1; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .editor-header button.is-active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .editor-header .separator { width: 1px; height: 20px; background: #cbd5e1; margin: 0 4px; }
        
        .ProseMirror {
            flex: 1;
            padding: 16px;
            outline: none;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            overflow-y: auto;
        }
        .ProseMirror h1 { font-size: 1.8em; margin: 0.5em 0; }
        .ProseMirror h2 { font-size: 1.5em; margin: 0.5em 0; }
        .ProseMirror h3 { font-size: 1.3em; margin: 0.5em 0; }
        .ProseMirror p { margin: 0.5em 0; }
        .ProseMirror ul, .ProseMirror ol { padding-left: 2em; margin: 0.5em 0; }
        .ProseMirror li { margin: 0.2em 0; }
        .ProseMirror a { color: #3b82f6; text-decoration: underline; cursor: pointer; }
        .ProseMirror strong { font-weight: bold; }
        .ProseMirror em { font-style: italic; }
        
        .viewer-panel { flex: 1; background: white; overflow: hidden; position: relative; margin-left: 0; transition: margin-left 0.3s ease; }
        .viewer-panel.fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; margin: 0; border-radius: 0; background: white; }
        .viewer-panel .markmap { width: 100%; height: 100%; }
        
        .fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .map-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            display: flex;
            gap: 5px;
            padding: 5px;
            z-index: 30;
        }
        .map-controls button { width: 32px; height: 32px; border: none; background: #f8fafc; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .map-controls button:hover { background: #e2e8f0; }
        
        @media (max-width: 768px) { .editor-panel { width: 100%; } .toggle-editor-btn { left: calc(100% - 40px); top: 70px; } .editor-panel.collapsed + .toggle-editor-btn { left: 10px; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader"></script>
    <!-- TipTap WYSIWYG -->
    <script src="https://unpkg.com/@tiptap/core@2.0.3/dist/index.js"></script>
    <script src="https://unpkg.com/@tiptap/starter-kit@2.0.3/dist/index.js"></script>
    <script src="https://unpkg.com/@tiptap/extension-placeholder@2.0.3/dist/index.js"></script>
    <script src="https://unpkg.com/@tiptap/extension-link@2.0.3/dist/index.js"></script>
    <script src="https://unpkg.com/@tiptap/pm@2.0.3/dist/index.js"></script>
</head>
<body>
    <div class="toolbar">
        <button id="save-btn" title="Сохранить в Markdown">💾 Сохранить</button>
        <button id="load-btn" title="Загрузить из Markdown">📂 Загрузить</button>
        <button id="print-btn" title="Распечатать текст">🖨️ Распечатать</button>
        <span class="status" id="status-text">✨ WYSIWYG + Markmap</span>
    </div>
    
    <div class="main-container">
        <div class="editor-panel" id="editor-panel">
            <div class="editor-header" id="editor-header">
                <button id="btn-h1" title="Заголовок 1">H1</button>
                <button id="btn-h2" title="Заголовок 2">H2</button>
                <button id="btn-h3" title="Заголовок 3">H3</button>
                <div class="separator"></div>
                <button id="btn-bold" title="Жирный (Ctrl+B)"><b>B</b></button>
                <button id="btn-italic" title="Курсив (Ctrl+I)"><i>I</i></button>
                <div class="separator"></div>
                <button id="btn-ul" title="Маркированный список">• Список</button>
                <button id="btn-ol" title="Нумерованный список">1. Список</button>
                <div class="separator"></div>
                <button id="btn-link" title="Вставить ссылку">🔗 Ссылка</button>
            </div>
            <div id="editor-content"></div>
        </div>
        <button class="toggle-editor-btn" id="toggle-editor-btn" title="Скрыть/показать редактор">◀</button>
        
        <div class="viewer-panel" id="viewer-panel">
            <div class="markmap" id="mindmap-container"></div>
            <button class="fullscreen-btn" id="fullscreen-btn" title="Полноэкранный режим">⛶</button>
            <div class="map-controls">
                <button id="collapse-all" title="Свернуть все ветки">−</button>
                <button id="expand-all" title="Развернуть всё">+</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader"></script>
    <script type="importmap">
        {
            "imports": {
                "@tiptap/core": "https://unpkg.com/@tiptap/core@2.0.3/dist/index.js",
                "@tiptap/starter-kit": "https://unpkg.com/@tiptap/starter-kit@2.0.3/dist/index.js",
                "@tiptap/extension-placeholder": "https://unpkg.com/@tiptap/extension-placeholder@2.0.3/dist/index.js",
                "@tiptap/extension-link": "https://unpkg.com/@tiptap/extension-link@2.0.3/dist/index.js",
                "@tiptap/pm": "https://unpkg.com/@tiptap/pm@2.0.3/dist/index.js"
            }
        }
    </script>
    <script type="module">
        import { Editor } from '@tiptap/core';
        import StarterKit from '@tiptap/starter-kit';
        import Link from '@tiptap/extension-link';
        import Placeholder from '@tiptap/extension-placeholder';
        
        // === ИНИЦИАЛИЗАЦИЯ TIPTAP EDITOR ===
        const editor = new Editor({
            element: document.getElementById('editor-content'),
            extensions: [
                StarterKit,
                Link.configure({ openOnClick: false }),
                Placeholder.configure({ placeholder: 'Начните писать здесь...' })
            ],
            content: '<h1>Центральная идея</h1><h2>Основной раздел 1</h2><h3>Деталь 1.1</h3><h3>Деталь 1.2</h3><h2>Основной раздел 2</h2><h3>Деталь 2.1</h3><h3>Деталь 2.2</h3><ul><li>Элемент списка 1</li><li>Элемент списка 2</li></ul>',
            onUpdate: ({ editor }) => {
                // Преобразуем HTML в Markdown для Markmap
                const html = editor.getHTML();
                const markdown = htmlToMarkdown(html);
                renderMindmap(markdown);
            }
        });
        
        // === КНОПКИ ФОРМАТИРОВАНИЯ ===
        document.getElementById('btn-h1').onclick = () => editor.chain().focus().toggleHeading({ level: 1 }).run();
        document.getElementById('btn-h2').onclick = () => editor.chain().focus().toggleHeading({ level: 2 }).run();
        document.getElementById('btn-h3').onclick = () => editor.chain().focus().toggleHeading({ level: 3 }).run();
        document.getElementById('btn-bold').onclick = () => editor.chain().focus().toggleBold().run();
        document.getElementById('btn-italic').onclick = () => editor.chain().focus().toggleItalic().run();
        document.getElementById('btn-ul').onclick = () => editor.chain().focus().toggleBulletList().run();
        document.getElementById('btn-ol').onclick = () => editor.chain().focus().toggleOrderedList().run();
        document.getElementById('btn-link').onclick = () => {
            const url = prompt('Введите URL:', 'https://');
            if (url) editor.chain().focus().setLink({ href: url }).run();
        };
        
        // Обработчики активных кнопок
        editor.on('transaction', () => {
            document.getElementById('btn-h1').classList.toggle('is-active', editor.isActive('heading', { level: 1 }));
            document.getElementById('btn-h2').classList.toggle('is-active', editor.isActive('heading', { level: 2 }));
            document.getElementById('btn-h3').classList.toggle('is-active', editor.isActive('heading', { level: 3 }));
            document.getElementById('btn-bold').classList.toggle('is-active', editor.isActive('bold'));
            document.getElementById('btn-italic').classList.toggle('is-active', editor.isActive('italic'));
            document.getElementById('btn-ul').classList.toggle('is-active', editor.isActive('bulletList'));
            document.getElementById('btn-ol').classList.toggle('is-active', editor.isActive('orderedList'));
            document.getElementById('btn-link').classList.toggle('is-active', editor.isActive('link'));
        });
        
        // === ПРЕОБРАЗОВАНИЕ HTML В MARKDOWN (простая версия) ===
        function htmlToMarkdown(html) {
            let md = html;
            md = md.replace(/<h1>(.*?)<\/h1>/g, '# $1\n');
            md = md.replace(/<h2>(.*?)<\/h2>/g, '## $1\n');
            md = md.replace(/<h3>(.*?)<\/h3>/g, '### $1\n');
            md = md.replace(/<strong>(.*?)<\/strong>/g, '**$1**');
            md = md.replace(/<em>(.*?)<\/em>/g, '*$1*');
            md = md.replace(/<ul>(.*?)<\/ul>/gs, (_, content) => {
                return content.replace(/<li>(.*?)<\/li>/g, '- $1\n');
            });
            md = md.replace(/<ol>(.*?)<\/ol>/gs, (_, content) => {
                let i = 1;
                return content.replace(/<li>(.*?)<\/li>/g, () => `${i++}. $1\n`);
            });
            md = md.replace(/<a href="(.*?)">(.*?)<\/a>/g, '[$2]($1)');
            md = md.replace(/<p>(.*?)<\/p>/g, '$1\n\n');
            md = md.replace(/<div>(.*?)<\/div>/g, '$1');
            md = md.replace(/<[^>]+>/g, '');
            md = md.replace(/&nbsp;/g, ' ');
            md = md.replace(/\n\s*\n\s*\n/g, '\n\n');
            return md.trim();
        }
        
        // === ОБНОВЛЕНИЕ КАРТЫ ===
        const container = document.getElementById('mindmap-container');
        function renderMindmap(markdownText) {
            if (!markdownText) return;
            try {
                container.innerHTML = markdownText;
                if (window.markmap?.autoLoader?.renderAll) {
                    window.markmap.autoLoader.renderAll();
                }
            } catch (e) {
                console.warn('Ошибка рендеринга карты:', e);
            }
        }
        
        // === СОХРАНЕНИЕ В MARKDOWN ФАЙЛ ===
        function saveToFile() {
            const html = editor.getHTML();
            const markdown = htmlToMarkdown(html);
            const blob = new Blob([markdown], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'document.md';
            a.click();
            URL.revokeObjectURL(url);
            statusSpan.innerText = '✅ Сохранено';
            setTimeout(() => statusSpan.innerText = '✨ WYSIWYG + Markmap', 1500);
        }
        
        // === ЗАГРУЗКА ИЗ MARKDOWN ФАЙЛА ===
        function loadFromFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.md,.txt';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const markdown = ev.target.result;
                    const html = markdownToHtml(markdown);
                    editor.commands.setContent(html);
                    renderMindmap(markdown);
                    statusSpan.innerText = '✅ Загружено';
                    setTimeout(() => statusSpan.innerText = '✨ WYSIWYG + Markmap', 1500);
                };
                reader.readAsText(file);
            };
            input.click();
        }
        
        // === ПРЕОБРАЗОВАНИЕ MARKDOWN В HTML (простая версия) ===
        function markdownToHtml(md) {
            let html = md;
            html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');
            html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
            html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/^- (.*$)/gm, '<ul><li>$1</li></ul>');
            html = html.replace(/^\d+\. (.*$)/gm, '<ol><li>$1</li></ol>');
            html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2">$1</a>');
            html = html.replace(/^(.*)$/gm, (match) => {
                if (!match.startsWith('<')) return `<p>${match}</p>`;
                return match;
            });
            html = html.replace(/<\/ul>\n<ul>/g, '');
            html = html.replace(/<\/ol>\n<ol>/g, '');
            return html;
        }
        
        // === ПЕЧАТЬ ТЕКСТА ===
        function printText() {
            const html = editor.getHTML();
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head>
                    <title>Документ</title>
                    <style>
                        body { font-family: 'Times New Roman', serif; margin: 40px; line-height: 1.5; }
                        h1 { font-size: 24px; margin: 20px 0 10px; }
                        h2 { font-size: 20px; margin: 15px 0 10px; }
                        h3 { font-size: 18px; margin: 10px 0 5px; }
                        ul, ol { margin: 10px 0; padding-left: 30px; }
                        li { margin: 5px 0; }
                        a { color: blue; }
                    </style>
                </head>
                <body>${html}</body>
                </html>
            `);
            printWindow.document.close();
            printWindow.print();
        }
        
        // === УПРАВЛЕНИЕ ПАНЕЛЬЮ РЕДАКТОРА ===
        const editorPanel = document.getElementById('editor-panel');
        const toggleBtn = document.getElementById('toggle-editor-btn');
        toggleBtn.onclick = () => {
            editorPanel.classList.toggle('collapsed');
            toggleBtn.textContent = editorPanel.classList.contains('collapsed') ? '▶' : '◀';
            setTimeout(() => renderMindmap(htmlToMarkdown(editor.getHTML())), 350);
        };
        
        // === ПОЛНОЭКРАННЫЙ РЕЖИМ ===
        const viewerPanel = document.getElementById('viewer-panel');
        document.getElementById('fullscreen-btn').onclick = () => {
            viewerPanel.classList.toggle('fullscreen');
            const btn = document.getElementById('fullscreen-btn');
            btn.textContent = viewerPanel.classList.contains('fullscreen') ? '✕' : '⛶';
            if (!editorPanel.classList.contains('collapsed')) {
                editorPanel.classList.add('collapsed');
                toggleBtn.textContent = '▶';
            }
            setTimeout(() => renderMindmap(htmlToMarkdown(editor.getHTML())), 100);
        };
        
        // === УПРАВЛЕНИЕ ВЕТКАМИ КАРТЫ ===
        function getMarkmapInstance() {
            const svg = document.querySelector('.markmap svg');
            return svg?.__markmap__ || null;
        }
        
        document.getElementById('collapse-all').onclick = () => {
            const mm = getMarkmapInstance();
            if (mm && mm.state?.data) {
                const collapse = (node) => { if (node.children) { node.state = node.state || {}; node.state.collapsed = true; node.children.forEach(collapse); } };
                collapse(mm.state.data);
                mm.render();
            }
        };
        
        document.getElementById('expand-all').onclick = () => {
            const mm = getMarkmapInstance();
            if (mm && mm.state?.data) {
                const expand = (node) => { if (node.children) { node.state = node.state || {}; node.state.collapsed = false; node.children.forEach(expand); } };
                expand(mm.state.data);
                mm.render();
            }
        };
        
        document.getElementById('save-btn').onclick = saveToFile;
        document.getElementById('load-btn').onclick = loadFromFile;
        document.getElementById('print-btn').onclick = printText;
        
        // Инициализация карты
        setTimeout(() => renderMindmap(htmlToMarkdown(editor.getHTML())), 500);
    </script>
</body>
</html>
