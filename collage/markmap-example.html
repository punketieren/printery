<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Markmap Viewer — Исправленная версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f7fb;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        .toolbar {
            background: white;
            padding: 12px 24px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .toolbar button {
            padding: 6px 14px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        .toolbar button.primary {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        .toolbar .status {
            margin-left: auto;
            font-size: 13px;
            color: #475569;
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .main-container {
            flex: 1;
            padding: 10px;
            overflow: hidden;
        }
        #mindmap-container {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            position: relative;
        }
        svg {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- Подключаем необходимые библиотеки -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/d3@6.7.0/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-common@0.18.12/dist/index.min.js"></script>
</head>
<body>
    <div class="toolbar">
        <button id="save-btn" class="primary">💾 Сохранить (Markdown)</button>
        <span class="status" id="status-text">✨ Загрузка...</span>
    </div>
    <div class="main-container">
        <div id="mindmap-container"></div>
    </div>

    <script>
        (function() {
            // Функция для проверки загрузки библиотек
            function checkLibraries() {
                const libs = {
                    'markmap-lib': typeof window.markmap !== 'undefined' && typeof window.markmap.Transformer !== 'undefined',
                    'markmap-view': typeof window.markmap !== 'undefined' && typeof window.markmap.Markmap !== 'undefined',
                    'd3': typeof d3 !== 'undefined',
                    'katex': typeof katex !== 'undefined'
                };
                const allLoaded = Object.values(libs).every(v => v === true);
                if (!allLoaded) {
                    console.warn('Не все библиотеки загружены:', libs);
                    document.getElementById('status-text').innerHTML = '❌ Ошибка загрузки библиотек. Проверьте подключение к интернету.';
                }
                return allLoaded;
            }

            // Данные для карты (Markdown)
            const defaultMarkdown = `# Центральная идея
## Основной раздел 1
### Деталь 1.1
### Деталь 1.2
#### Подробность 1.2.1
#### Подробность 1.2.2
## Основной раздел 2
### Деталь 2.1
### Деталь 2.2
- Элемент списка 1
- Элемент списка 2`;

            let currentMarkmap = null;
            let currentMarkdown = defaultMarkdown;

            // Функция рендеринга карты
            function renderMindmap(markdownText) {
                try {
                    if (!checkLibraries()) return;
                    
                    // Получаем ссылки на конструкторы
                    const Transformer = window.markmap.Transformer;
                    const Markmap = window.markmap.Markmap;
                    
                    if (!Transformer || !Markmap) {
                        throw new Error('Не удалось найти Transformer или Markmap');
                    }
                    
                    // Преобразуем Markdown в данные
                    const transformer = new Transformer();
                    const { root } = transformer.transform(markdownText);
                    
                    // Получаем контейнер
                    const container = document.getElementById('mindmap-container');
                    if (!container) return;
                    
                    // Очищаем контейнер
                    while (container.firstChild) {
                        container.removeChild(container.firstChild);
                    }
                    
                    // Создаём SVG элемент
                    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    svg.style.width = "100%";
                    svg.style.height = "100%";
                    container.appendChild(svg);
                    
                    // Создаём карту
                    currentMarkmap = Markmap.create(svg, {
                        autoFit: true,
                        duration: 500,
                        initialExpandLevel: 2,
                        color: (node) => {
                            // Генерация цвета в зависимости от уровня
                            const level = node.depth || 0;
                            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
                            return colors[level % colors.length];
                        }
                    }, root);
                    
                    document.getElementById('status-text').innerHTML = '✅ Карта загружена. Двойной клик по узлу для редактирования.';
                    setTimeout(() => {
                        if (document.getElementById('status-text').innerHTML.includes('Карта загружена')) {
                            document.getElementById('status-text').innerHTML = '✨ Готово. Двойной клик по узлу для редактирования.';
                        }
                    }, 3000);
                    
                } catch (error) {
                    console.error('Ошибка рендеринга:', error);
                    document.getElementById('status-text').innerHTML = '❌ Ошибка рендеринга: ' + error.message;
                }
            }

            // Сохранение в файл
            function saveToFile() {
                const blob = new Blob([currentMarkdown], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'mindmap.md';
                a.click();
                URL.revokeObjectURL(url);
                document.getElementById('status-text').innerHTML = '✅ Файл сохранён';
                setTimeout(() => {
                    document.getElementById('status-text').innerHTML = '✨ Готово. Двойной клик по узлу для редактирования.';
                }, 2000);
            }

            // Попробуем отрисовать карту после загрузки страницы
            window.addEventListener('load', () => {
                setTimeout(() => {
                    if (checkLibraries()) {
                        renderMindmap(defaultMarkdown);
                    } else {
                        document.getElementById('status-text').innerHTML = '❌ Ошибка: не удалось загрузить библиотеки. Проверьте подключение к интернету.';
                    }
                }, 100);
            });

            // Подключаем кнопку сохранения
            const saveBtn = document.getElementById('save-btn');
            if (saveBtn) {
                saveBtn.addEventListener('click', saveToFile);
            }
            
            // Адаптация при изменении размера окна
            window.addEventListener('resize', () => {
                if (currentMarkmap && currentMarkmap.fit) {
                    setTimeout(() => {
                        currentMarkmap.fit();
                    }, 200);
                }
            });
        })();
    </script>
</body>
</html>
